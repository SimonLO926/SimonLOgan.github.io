<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>架塊</title>
  <style>
    :root {
      --ink: #17211b;
      --paper: #f4f1e8;
      --well: #f7f4ec;
      --line: rgba(23, 33, 27, .18);
      --acid: #dfff45;
      --panel: rgba(255, 255, 255, .45);
    }

    body[data-theme="dark"] {
      --ink: #f4f1e8;
      --paper: #111111;
      --well: #1a1a1a;
      --line: rgba(244, 241, 232, .2);
      --acid: #dfff45;
      --panel: rgba(255, 255, 255, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    button, select, input { font: inherit; color: inherit; }

    button {
      border: 1px solid var(--ink);
      background: var(--acid);
      color: #17211b;
      font-weight: 700;
      padding: 12px 14px;
      cursor: pointer;
    }

    .page { width: min(980px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 40px; }

    h1 { margin: 0; font-size: 56px; letter-spacing: -.06em; line-height: .9; }
    h1 span { background: var(--acid); color: #17211b; padding: 0 8px; }

    .lede, .hint { line-height: 1.5; }
    .menu-actions, .settings-grid { display: grid; gap: 10px; max-width: 360px; margin-top: 22px; }
    .settings-grid label { display: grid; gap: 6px; font-size: 14px; }
    select, input[type="range"] { width: 100%; }
    .theme-row { display: flex; gap: 8px; }
    .theme-row button[aria-pressed="true"] { outline: 2px solid var(--ink); }

    .top-link { font-size: 13px; font-weight: 700; color: inherit; }

    .stage {
      display: grid;
      grid-template-columns: 148px auto 168px;
      gap: 18px;
      align-items: start;
      justify-content: center;
    }

    .panel { display: grid; gap: 14px; }
    .box { border: 1px solid var(--line); background: var(--panel); padding: 10px; }
    .box h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .12em; }
    .stat { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
    .stat b { font-size: 18px; }
    .board-wrap { position: relative; width: max-content; justify-self: center; }
    canvas { display: block; background: var(--well); border: 2px solid var(--ink); }
    #hold-canvas.used { opacity: .38; }

    .veil {
      position: absolute;
      inset: 2px;
      display: grid;
      align-content: center;
      gap: 10px;
      padding: 22px;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
    }

    .veil[hidden] { display: none; }
    .veil h2 { margin: 0; font-size: 28px; }
    .veil p { margin: 0; line-height: 1.5; }
    .pad { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
    .keys { font-size: 13px; line-height: 1.6; }
    kbd { border: 1px solid var(--line); padding: 0 5px; }

    @media (max-width: 760px) {
      h1 { font-size: 40px; }
      .stage { grid-template-columns: 1fr; }
      .panel { grid-template-columns: 1fr 1fr; }
      .pad { display: grid; }
      .keys { display: none; }
    }
  </style>
</head>
<body data-theme="light">
  <div class="page">
    <section id="menu">
      <h1><span data-i18n="title">架塊</span></h1>
      <p class="lede" data-i18n="lede"></p>
      <p class="hint" data-i18n="menuHint"></p>
      <div class="menu-actions">
        <button id="go-marathon" type="button" data-i18n="marathon">馬拉松</button>
        <button id="go-sprint" type="button" data-i18n="sprint">40 行競速</button>
        <button id="go-settings" type="button" data-i18n="settings">設定</button>
        <a class="top-link" href="../index.html" data-i18n="back">回作品列表</a>
      </div>
    </section>

    <section id="settings" hidden>
      <h1><span data-i18n="settings">設定</span></h1>
      <div class="settings-grid">
        <label><span data-i18n="language">語言</span>
          <select id="lang">
            <option value="zh-Hant">繁體中文</option>
            <option value="zh-Hans">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label><span data-i18n="volume">音量</span>
          <input id="volume" type="range" min="0" max="100" value="70">
        </label>
        <div>
          <div data-i18n="theme">背景</div>
          <div class="theme-row">
            <button id="theme-light" type="button" data-i18n="light">白底</button>
            <button id="theme-dark" type="button" data-i18n="dark">黑底</button>
          </div>
        </div>
        <button id="settings-back" type="button" data-i18n="close">返回</button>
      </div>
    </section>

    <section id="game" hidden>
      <div class="stage">
        <aside class="panel">
          <section class="box">
            <h2 data-i18n="hold">保留</h2>
            <canvas id="hold-canvas" width="112" height="96"></canvas>
            <p class="hint" id="hold-state"></p>
          </section>
        </aside>
        <div class="board-wrap">
          <canvas id="board" width="280" height="560"></canvas>
          <div class="veil" id="veil" hidden>
            <h2 id="veil-title"></h2>
            <p id="veil-copy"></p>
            <button id="veil-btn" type="button"></button>
            <button id="veil-menu" type="button" data-i18n="menu">回選單</button>
          </div>
        </div>
        <aside class="panel">
          <section class="box">
            <h2 data-i18n="next">下一個</h2>
            <canvas id="next-canvas" width="112" height="250"></canvas>
          </section>
          <section class="box">
            <div class="stat"><span data-i18n="score">分數</span><b id="score">0</b></div>
            <div class="stat"><span data-i18n="lines">消除</span><b id="lines">0</b></div>
            <div class="stat"><span id="third-label" data-i18n="stage">階段</span><b id="third">1</b></div>
            <div class="stat"><span data-i18n="best">最高</span><b id="best">0</b></div>
          </section>
          <button id="game-menu" type="button" data-i18n="menu">回選單</button>
        </aside>
      </div>
      <div class="pad">
        <button type="button" id="btn-left" data-i18n="left">左</button>
        <button type="button" id="btn-right" data-i18n="right">右</button>
        <button type="button" id="btn-rot" data-i18n="rotate">轉</button>
        <button type="button" id="btn-hold" data-i18n="keep">留</button>
        <button type="button" id="btn-drop" data-i18n="drop">落</button>
      </div>
      <p class="keys" data-i18n="keys"></p>
    </section>
  </div>
  <script type="module">
    import { createSession, drawSession, updateSession } from "./arcade.mjs";
    import { translate } from "./i18n.mjs";
    import {
      COLS, ROWS, SHAPES, cellsOf, createGame, fits, flipGrid, ghostY, gravityMs,
      hardDrop, hold, lockActive, pump, startGame, tryMove, tryRotate,
    } from "./logic.mjs";

    const COLORS = {
      I: "#1f8aa8", O: "#e2a322", T: "#b14d9a", S: "#3f8f4e", Z: "#d4533a",
      J: "#3d62b5", L: "#e07a2f", B: "#17211b", X: "#243b73", D: "#c46a2b", R: "#ff4d6d",
    };
    const CELL = 28;
    const board = document.querySelector("#board");
    const holdCanvas = document.querySelector("#hold-canvas");
    const nextCanvas = document.querySelector("#next-canvas");
    const ctx = board.getContext("2d");
    const holdCtx = holdCanvas.getContext("2d");
    const nextCtx = nextCanvas.getContext("2d");
    const veil = document.querySelector("#veil");
    const game = createGame();
    const settings = loadSettings();
    let paused = false;
    let acc = 0;
    let softAcc = 0;
    let lockMs = 0;
    let lockResets = 0;
    let anim = null;
    let session = null;
    let last = performance.now();
    let startedAt = 0;
    let frozenTime = 0;
    const heldKeys = new Set();
    let dasDir = 0;
    let dasTime = 0;
    let dasOn = false;
    let audio;
    let master;

    applySettings();

    function loadSettings() {
      try {
        return { lang: "zh-Hant", volume: 0.7, theme: "light", ...JSON.parse(localStorage.getItem("bridge-settings") || "{}") };
      } catch {
        return { lang: "zh-Hant", volume: 0.7, theme: "light" };
      }
    }

    function saveSettings() {
      localStorage.setItem("bridge-settings", JSON.stringify(settings));
    }

    function t(key) { return translate(settings.lang, key); }

    function applySettings() {
      document.body.dataset.theme = settings.theme;
      document.documentElement.lang = settings.lang;
      document.title = t("title");
      for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
      document.querySelector("#lang").value = settings.lang;
      document.querySelector("#volume").value = String(Math.round(settings.volume * 100));
      document.querySelector("#theme-light").setAttribute("aria-pressed", String(settings.theme === "light"));
      document.querySelector("#theme-dark").setAttribute("aria-pressed", String(settings.theme === "dark"));
      if (master) master.gain.value = settings.volume;
    }

    function blip(freq, dur) {
      if (settings.volume <= 0) return;
      try {
        audio ??= new AudioContext();
        master ??= audio.createGain();
        master.gain.value = settings.volume;
        master.connect(audio.destination);
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.frequency.value = freq;
        osc.type = "square";
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
        osc.stop(audio.currentTime + dur);
      } catch { audio = null; }
    }

    function bestKey() { return game.mode === "sprint" ? "bridge-best-sprint" : "bridge-best-marathon"; }

    function readBest() {
      const raw = Number(localStorage.getItem(bestKey()) || 0);
      return Number.isFinite(raw) ? raw : 0;
    }

    function formatTime(ms) {
      const total = Math.max(0, ms) / 1000;
      const mins = Math.floor(total / 60);
      return `${mins}:${(total - mins * 60).toFixed(2).padStart(5, "0")}`;
    }

    function showScreen(id) {
      for (const name of ["menu", "settings", "game"]) document.querySelector(`#${name}`).hidden = name !== id;
    }

    function resetTimers() { acc = 0; softAcc = 0; lockMs = 0; lockResets = 0; }

    function begin(mode) {
      startGame(game, mode);
      paused = false;
      session = null;
      anim = null;
      resetTimers();
      heldKeys.clear();
      startedAt = performance.now();
      frozenTime = 0;
      veil.hidden = true;
      showScreen("game");
    }

    function backToMenu() {
      paused = false;
      session = null;
      game.phase = "ready";
      showScreen("menu");
    }

    function showVeil(title, copy, label) {
      veil.hidden = false;
      document.querySelector("#veil-title").textContent = title;
      document.querySelector("#veil-copy").textContent = copy;
      document.querySelector("#veil-btn").textContent = label;
    }

    function onManeuver() {
      if (!game.active) return;
      const { type, rot, x, y } = game.active;
      if (!fits(game.grid, type, rot, x, y + 1) && lockResets < 12) {
        lockMs = 0;
        lockResets += 1;
      }
    }

    function shift(dir) {
      if (paused || game.phase !== "playing" || !tryMove(game, dir, 0)) return;
      onManeuver();
    }

    function doRotate(dir) {
      if (paused || !tryRotate(game, dir)) return;
      onManeuver();
      blip(700, 0.02);
    }

    function doHold() {
      if (paused || !hold(game)) return;
      resetTimers();
      blip(520, 0.04);
    }

    function doHard() {
      if (session) {
        session.fire = true;
        return;
      }
      if (paused || game.phase !== "playing") return;
      hardDrop(game);
      resetTimers();
      blip(160, 0.05);
    }

    document.querySelector("#go-marathon").addEventListener("click", () => begin("marathon"));
    document.querySelector("#go-sprint").addEventListener("click", () => begin("sprint"));
    document.querySelector("#go-settings").addEventListener("click", () => showScreen("settings"));
    document.querySelector("#settings-back").addEventListener("click", () => showScreen("menu"));
    document.querySelector("#game-menu").addEventListener("click", backToMenu);
    document.querySelector("#veil-menu").addEventListener("click", backToMenu);
    document.querySelector("#veil-btn").addEventListener("click", () => {
      if (game.phase === "over" || game.phase === "done") begin(game.mode);
      else paused = false;
    });
    document.querySelector("#lang").addEventListener("change", (event) => {
      settings.lang = event.target.value;
      saveSettings();
      applySettings();
    });
    document.querySelector("#volume").addEventListener("input", (event) => {
      settings.volume = Number(event.target.value) / 100;
      saveSettings();
      applySettings();
    });
    document.querySelector("#theme-light").addEventListener("click", () => { settings.theme = "light"; saveSettings(); applySettings(); });
    document.querySelector("#theme-dark").addEventListener("click", () => { settings.theme = "dark"; saveSettings(); applySettings(); });

    window.addEventListener("keydown", (event) => {
      const key = event.key;
      if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(key)) event.preventDefault();
      if (key === "p" || key === "P" || key === "Escape") {
        if (["playing", "resolving", "breakout", "bbtan", "pinball"].includes(game.phase)) paused = !paused;
        return;
      }
      if (paused) return;
      if (session) {
        if (key === "ArrowLeft") session.left = true;
        if (key === "ArrowRight") session.right = true;
        if (!event.repeat && (key === " " || key === "ArrowUp")) session.fire = true;
        return;
      }
      if (game.phase !== "playing") return;
      if (key === "ArrowLeft") {
        heldKeys.add("left");
        if (!event.repeat) { dasDir = -1; dasTime = 0; dasOn = false; shift(-1); }
      } else if (key === "ArrowRight") {
        heldKeys.add("right");
        if (!event.repeat) { dasDir = 1; dasTime = 0; dasOn = false; shift(1); }
      } else if (key === "ArrowDown") heldKeys.add("down");
      else if (!event.repeat && (key === "ArrowUp" || key === "x" || key === "X")) doRotate(1);
      else if (!event.repeat && (key === "z" || key === "Z")) doRotate(-1);
      else if (!event.repeat && key === " ") doHard();
      else if (!event.repeat && (key === "c" || key === "C" || key === "Shift")) doHold();
    });

    window.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft") { heldKeys.delete("left"); if (session) session.left = false; }
      if (event.key === "ArrowRight") { heldKeys.delete("right"); if (session) session.right = false; }
      if (event.key === "ArrowDown") heldKeys.delete("down");
      if (!heldKeys.has("left") && !heldKeys.has("right")) dasDir = 0;
    });

    function bindPress(id, down, up) {
      const el = document.querySelector(id);
      el.addEventListener("pointerdown", (event) => { event.preventDefault(); down(); });
      if (up) {
        el.addEventListener("pointerup", up);
        el.addEventListener("pointercancel", up);
        el.addEventListener("pointerleave", up);
      }
    }

    let leftTimer = 0;
    let rightTimer = 0;
    bindPress("#btn-left", () => {
      if (session) { session.left = true; return; }
      shift(-1);
      leftTimer = window.setInterval(() => shift(-1), 70);
    }, () => { if (session) session.left = false; window.clearInterval(leftTimer); });
    bindPress("#btn-right", () => {
      if (session) { session.right = true; return; }
      shift(1);
      rightTimer = window.setInterval(() => shift(1), 70);
    }, () => { if (session) session.right = false; window.clearInterval(rightTimer); });
    bindPress("#btn-rot", () => doRotate(1));
    bindPress("#btn-hold", doHold);
    bindPress("#btn-drop", doHard);

    function ink() { return document.body.dataset.theme === "dark" ? "#f4f1e8" : "#17211b"; }
    function well() { return document.body.dataset.theme === "dark" ? "#1a1a1a" : "#f7f4ec"; }
    function pieceColor(type) {
      if (type === "B" && document.body.dataset.theme === "dark") return "#e6e0d4";
      return COLORS[type] || ink();
    }

    function drawBlob(context, cells, type, size, ghost, markIndex = null) {
      const set = new Set(cells.map(([x, y]) => `${x},${y}`));
      context.fillStyle = pieceColor(type);
      context.strokeStyle = ink();
      context.lineWidth = 2;
      cells.forEach(([x, y], index) => {
        if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return;
        const neighbors = [set.has(`${x - 1},${y}`), set.has(`${x + 1},${y}`), set.has(`${x},${y - 1}`), set.has(`${x},${y + 1}`)];
        const inset = 1.5;
        const left = x * size + (neighbors[0] ? 0 : inset);
        const top = y * size + (neighbors[2] ? 0 : inset);
        const right = (x + 1) * size - (neighbors[1] ? 0 : inset);
        const bottom = (y + 1) * size - (neighbors[3] ? 0 : inset);
        if (ghost) context.strokeRect(x * size + 4, y * size + 4, size - 8, size - 8);
        else {
          context.fillRect(left, top, right - left, bottom - top);
          if (index === markIndex && (type === "B" || type === "X")) {
            context.fillStyle = type === "B" ? "#dfff45" : "#7ee0ff";
            context.beginPath();
            context.arc(x * size + size / 2, y * size + size / 2, Math.max(3, size * 0.16), 0, Math.PI * 2);
            context.fill();
          }
        }
      });
    }

    function drawGridCells(context, grid, skip, size) {
      const drawn = new Set();
      for (let y = 0; y < ROWS; y += 1) {
        for (let x = 0; x < COLS; x += 1) {
          const cell = grid[y][x];
          if (!cell || skip.has(cell.g) || drawn.has(cell.g)) continue;
          drawn.add(cell.g);
          const group = [];
          for (let gy = 0; gy < ROWS; gy += 1) {
            for (let gx = 0; gx < COLS; gx += 1) {
              if (grid[gy][gx]?.g === cell.g) group.push([gx, gy]);
            }
          }
          drawBlob(context, group, cell.type, size, false);
        }
      }
      context.fillStyle = "#dfff45";
      for (let y = 0; y < ROWS; y += 1) {
        for (let x = 0; x < COLS; x += 1) {
          const cell = grid[y][x];
          if (!cell || skip.has(cell.g)) continue;
          if (!cell.bomb && cell.reward !== "bbtan") continue;
          context.fillStyle = cell.bomb ? "#dfff45" : "#7ee0ff";
          context.beginPath();
          context.arc(x * size + size / 2, y * size + size / 2, Math.max(3, size * 0.16), 0, Math.PI * 2);
          context.fill();
        }
      }
    }

    function paintPreview(context, canvas, pieces) {
      context.clearRect(0, 0, canvas.width, canvas.height);
      const slots = Math.max(pieces.length, 1);
      pieces.forEach((piece, index) => {
        if (!piece?.type) return;
        const cells = SHAPES[piece.type][0];
        const xs = cells.map(([x]) => x);
        const ys = cells.map(([, y]) => y);
        const size = 22;
        const ox = (canvas.width - (Math.max(...xs) - Math.min(...xs) + 1) * size) / 2 - Math.min(...xs) * size;
        const slot = canvas.height / slots;
        const oy = index * slot + (slot - (Math.max(...ys) - Math.min(...ys) + 1) * size) / 2 - Math.min(...ys) * size;
        context.save();
        context.translate(ox, oy);
        drawBlob(context, cells, piece.type, size, false, piece.bombIndex);
        context.restore();
      });
    }

    function drawBoard() {
      ctx.fillStyle = well();
      ctx.fillRect(0, 0, board.width, board.height);
      const flipping = anim?.step.type === "flip" || anim?.step.type === "reward";
      if (flipping) {
        const turn = Math.min(1, anim.t / anim.dur);
        const angle = Math.PI * (1 - Math.cos(Math.PI * turn)) / 2;
        ctx.save();
        ctx.translate(board.width / 2, board.height / 2);
        ctx.rotate(angle);
        ctx.translate(-board.width / 2, -board.height / 2);
      }
      ctx.strokeStyle = document.body.dataset.theme === "dark" ? "rgba(244,241,232,.08)" : "rgba(23,33,27,.08)";
      for (let x = 1; x < COLS; x += 1) {
        ctx.beginPath(); ctx.moveTo(x * CELL + .5, 0); ctx.lineTo(x * CELL + .5, board.height); ctx.stroke();
      }
      for (let y = 1; y < ROWS; y += 1) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL + .5); ctx.lineTo(board.width, y * CELL + .5); ctx.stroke();
      }
      const skip = new Set();
      if (anim?.step.type === "drop") for (const move of anim.step.moves) skip.add(move.g);
      drawGridCells(ctx, game.grid, skip, CELL);
      if (anim?.step.type === "drop") {
        const turn = Math.min(1, anim.t / anim.dur);
        const eased = 1 - (1 - turn) ** 2;
        for (const move of anim.step.moves) {
          const y = move.y0 + (move.y1 - move.y0) * eased;
          ctx.fillStyle = pieceColor(move.type);
          ctx.fillRect(move.x * CELL + 1.5, y * CELL + 1.5, CELL - 3, CELL - 3);
        }
      }
      if (anim?.step.type === "clear") {
        ctx.globalAlpha = 1 - anim.t / anim.dur;
        for (const cell of anim.step.cells) {
          ctx.fillStyle = pieceColor(cell.type);
          ctx.fillRect(cell.x * CELL + 1.5, cell.y * CELL + 1.5, CELL - 3, CELL - 3);
        }
        ctx.globalAlpha = 1;
        for (const cell of anim.step.blasts || []) {
          ctx.fillStyle = "#dfff45";
          ctx.beginPath();
          ctx.arc(cell.x * CELL + CELL / 2, cell.y * CELL + CELL / 2, CELL * 0.72, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (game.active && game.phase === "playing") {
        const gy = ghostY(game);
        drawBlob(ctx, cellsOf(game.active.type, game.active.rot, game.active.x, gy), game.active.type, CELL, true);
        drawBlob(ctx, cellsOf(game.active.type, game.active.rot, game.active.x, game.active.y), game.active.type, CELL, false, game.active.bombIndex);
      }
      if (session) drawSession(ctx, session, ink());
      if (flipping) ctx.restore();
    }

    function elapsed() {
      if (!startedAt) return 0;
      if (frozenTime) return frozenTime - startedAt;
      return performance.now() - startedAt;
    }

    function draw() {
      if (document.querySelector("#game").hidden) return;
      drawBoard();
      holdCanvas.classList.toggle("used", game.holdLocked && game.phase === "playing");
      document.querySelector("#hold-state").textContent = game.holdLocked && game.phase === "playing" ? t("holdUsed") : t("holdReady");
      paintPreview(holdCtx, holdCanvas, [game.hold]);
      paintPreview(nextCtx, nextCanvas, game.queue.slice(0, 3));
      document.querySelector("#score").textContent = String(game.score);
      document.querySelector("#lines").textContent = game.mode === "sprint" ? `${game.lines}/40` : String(game.lines);
      document.querySelector("#third-label").textContent = game.mode === "sprint" ? t("time") : t("stage");
      document.querySelector("#third").textContent = game.mode === "sprint" ? formatTime(elapsed()) : String(game.stage);
      const best = readBest();
      document.querySelector("#best").textContent = game.mode === "sprint" ? (best ? formatTime(best) : "–") : String(Math.max(best, game.score));
      document.querySelector("#btn-drop").textContent = session?.kind === "bbtan" ? t("fire") : t("drop");
      if (paused && game.phase !== "over" && game.phase !== "done") showVeil(t("paused"), t("pauseHint"), t("resume"));
      else if (!paused && (game.phase === "playing" || session)) veil.hidden = true;
    }

    function finishSession() {
      game.score += session.score;
      if (session.full) game.score += 2000 * game.stage;
      session = null;
      game.phase = "resolving";
    }

    function frame(now) {
      const dt = Math.min(34, now - last);
      last = now;
      if (!document.querySelector("#game").hidden && !paused && game.phase === "playing" && game.active) {
        if (dasDir && ((dasDir < 0 && heldKeys.has("left")) || (dasDir > 0 && heldKeys.has("right")))) {
          dasTime += dt;
          if (dasTime >= (dasOn ? 35 : 150)) {
            dasTime = 0;
            dasOn = true;
            shift(dasDir);
          }
        }
        if (heldKeys.has("down")) {
          softAcc += dt;
          while (softAcc >= 45) {
            softAcc -= 45;
            if (tryMove(game, 0, 1)) game.score += 1;
          }
        }
        acc += dt;
        while (acc >= gravityMs(game) && game.phase === "playing") {
          acc -= gravityMs(game);
          if (!tryMove(game, 0, 1)) break;
          lockMs = 0;
        }
        if (game.active && !fits(game.grid, game.active.type, game.active.rot, game.active.x, game.active.y + 1)) {
          lockMs += dt;
          if (lockMs >= 480) {
            lockActive(game);
            resetTimers();
            blip(140, 0.04);
          }
        } else lockMs = 0;
      }

      if (!paused && session) {
        updateSession(session, dt);
        if (session.over) finishSession();
      }

      if (!paused && game.phase === "resolving") {
        if (anim) {
          anim.t += dt;
          if (anim.t >= anim.dur) {
            const step = anim.step;
            anim = null;
            if (step.type === "flip" || step.type === "reward") flipGrid(game);
            if (step.type === "reward") {
              session = createSession(step.reward, game.grid, game.stage, game.random);
              game.phase = step.reward;
            }
          }
        }
        if (!anim && game.phase === "resolving") {
          const step = pump(game);
          if (step?.type === "clear" || step?.type === "drop" || step?.type === "flip" || step?.type === "reward") {
            const distance = step.type === "drop" ? Math.max(0, ...step.moves.map((move) => move.y1 - move.y0)) : 0;
            const dur = step.type === "clear" ? (step.blasts?.length ? 280 : 170) : step.type === "drop" ? 120 + distance * 18 : 460;
            anim = { step, t: 0, dur };
            if (step.type === "clear") blip(step.blasts?.length ? 90 : 240, 0.06);
            if (step.type === "flip" || step.type === "reward") blip(180, 0.08);
          } else if (step?.type === "done") {
            frozenTime = performance.now();
            const time = elapsed();
            const best = readBest();
            if (!best || time < best) localStorage.setItem(bestKey(), String(time));
            showVeil(t("cleared"), formatTime(time), t("again"));
          } else if (step?.type === "over" || game.phase === "over") {
            const best = readBest();
            if (game.score > best) localStorage.setItem(bestKey(), String(game.score));
            showVeil(t("topped"), String(game.score), t("again"));
          } else if (step?.type === "spawn") resetTimers();
        }
      }
      draw();
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
