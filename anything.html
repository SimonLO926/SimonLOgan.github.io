<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#12100e" />
<meta name="color-scheme" content="dark" />
<meta name="description" content="無窮珍奇櫃：一個會自己一直發明故事、詩、城市與生物的單檔網頁。" />
<title>無窮珍奇櫃</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2312100e' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%238f2d2d' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23a6844a'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #12100e;
    --paper: #f4ecdc;
    --paper-2: #efe2cc;
    --ink: #1c1712;
    --muted: #7c7164;
    --seal: #8f2d2d;
    --gold: #a6844a;
    --line: rgba(243, 234, 215, 0.16);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti TC", "Songti SC", "PMingLiU", "Noto Serif CJK TC", serif;
    --sans: "Avenir Next", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  ::selection { background: var(--gold); color: var(--bg); }
  #sky {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .app {
    position: relative;
    z-index: 1;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  header {
    padding: 20px 28px 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(18, 16, 14, 0.92), rgba(18, 16, 14, 0.72));
  }
  .header-row {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: flex-start;
  }
  .brand .en {
    margin: 0;
    color: var(--gold);
    letter-spacing: 0.32em;
    font-size: 11px;
  }
  h1 {
    margin: 2px 0 0;
    font-family: var(--serif);
    font-size: 36px;
    font-weight: 560;
    letter-spacing: 0.08em;
  }
  .lede {
    margin: 6px 0 0;
    max-width: 40em;
    color: rgba(243, 234, 215, 0.78);
  }
  .meter { flex: none; text-align: right; }
  .meter strong {
    display: block;
    font-family: var(--serif);
    font-size: 32px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .meter .sub {
    display: block;
    white-space: nowrap;
    color: rgba(243, 234, 215, 0.62);
    font-size: 12px;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-top: 14px;
  }
  .toolbar button, .toolbar select {
    background: transparent;
    border: 1px solid rgba(243, 234, 215, 0.28);
    border-radius: 999px;
    padding: 7px 14px;
  }
  .toolbar button:hover, .toolbar select:hover { border-color: var(--gold); }
  .toolbar button[aria-pressed="true"] {
    background: var(--paper);
    color: var(--ink);
    border-color: var(--paper);
  }
  label.speed {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(243, 234, 215, 0.78);
    font-size: 13px;
  }
  input[type="range"] { accent-color: var(--gold); width: 120px; }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
  }
  #stage {
    min-height: 0;
    overflow: auto;
    padding: 18px 22px 48px;
  }
  #stream {
    width: min(680px, 100%);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  #shelf {
    min-height: 0;
    overflow: auto;
    border-left: 1px solid var(--line);
    padding: 16px 14px 24px;
    background: rgba(0, 0, 0, 0.18);
  }
  #shelf h2 {
    margin: 0 0 4px;
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 500;
  }
  .shelf-note { margin: 0 0 12px; color: rgba(243, 234, 215, 0.55); font-size: 12px; }
  .shelf-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .shelf-item {
    flex: 1;
    text-align: left;
    background: rgba(243, 234, 215, 0.05);
    border: 1px solid rgba(243, 234, 215, 0.12);
    border-radius: 8px;
    padding: 8px 10px;
    min-width: 0;
  }
  .shelf-item small {
    display: block;
    color: var(--gold);
    letter-spacing: 0.16em;
    font-size: 10px;
  }
  .shelf-item strong {
    display: block;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .icon-btn {
    width: 32px;
    border-radius: 8px;
    border: 1px solid rgba(243, 234, 215, 0.16);
    background: transparent;
  }
  .shelf-actions { display: flex; gap: 8px; margin-top: 8px; }
  .shelf-actions button {
    flex: 1;
    background: transparent;
    border: 1px solid rgba(243, 234, 215, 0.22);
    border-radius: 999px;
    padding: 7px 10px;
  }
  .empty-shelf { color: rgba(243, 234, 215, 0.55); font-size: 14px; }
  .card {
    position: relative;
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    color: var(--ink);
    border-radius: 4px;
    padding: 22px 26px 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    border-left: 3px solid var(--gold);
    animation: rise 0.45s ease;
  }
  @keyframes rise {
    from { transform: translateY(8px); }
    to { transform: none; }
  }
  #stream .card:first-child { box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(166, 132, 74, 0.55); }
  .type-story { border-left-color: #314155; }
  .type-poem { border-left-color: #a6844a; }
  .type-dialogue { border-left-color: #3f6b62; }
  .type-question { border-left-color: #6d5a8e; }
  .type-menu { border-left-color: #b36a3a; }
  .type-city { border-left-color: #8f2d2d; }
  .type-creature { border-left-color: #4d7a48; }
  .type-star { border-left-color: #2d4570; }
  .type-color { border-left-color: #a6844a; }
  .type-invention { border-left-color: #5c4636; }
  .type-law { border-left-color: #8f2d2d; }
  .type-dream { border-left-color: #3d4c7a; }
  .type-pattern { border-left-color: #7a6246; }
  .type-note { border-left-color: #a6844a; background: #f6e7cf; }
  .type-law { box-shadow: inset 0 4px 0 #8f2d2d, 0 18px 50px rgba(0, 0, 0, 0.35); }
  .card-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: baseline;
    padding-right: 68px;
    margin-bottom: 8px;
  }
  .kicker {
    color: var(--seal);
    letter-spacing: 0.22em;
    font-size: 12px;
  }
  .num {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
    font-variant-numeric: tabular-nums;
  }
  .seal {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 52px;
    height: 52px;
    border: 2px solid var(--seal);
    color: var(--seal);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-family: var(--serif);
    font-size: 18px;
    transform: rotate(-14deg);
    opacity: 0.88;
    background: rgba(255, 250, 240, 0.35);
  }
  .card-title {
    margin: 0 0 10px;
    padding-right: 56px;
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.35;
  }
  .type-poem .card-title,
  .type-poem .card-body,
  .type-poem .epigraph {
    text-align: center;
    padding-right: 64px;
    padding-left: 64px;
  }
  .type-question .card-title { font-size: 22px; font-weight: 560; line-height: 1.6; }
  .type-law .card-title { font-size: 20px; letter-spacing: 0.14em; }
  .card-body {
    margin: 0;
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.85;
    white-space: pre-wrap;
  }
  .epigraph {
    margin: 12px 0 0;
    text-align: center;
    letter-spacing: 0.14em;
    color: var(--muted);
    font-size: 12px;
  }
  .visual { margin-top: 14px; position: relative; z-index: 1; }
  .visual canvas, .visual svg { width: 100%; height: auto; display: block; border-radius: 2px; }
  .swatches {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    grid-template-rows: 78px 78px;
    gap: 8px;
  }
  .swatch {
    border: none;
    border-radius: 2px;
    padding: 8px;
    text-align: left;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-width: 0;
  }
  .swatch.hero { grid-row: 1 / span 2; }
  .swatch span, .swatch small {
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.15);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .swatch small { opacity: 0.85; font-variant-numeric: tabular-nums; }
  .card-actions {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
  }
  .card-actions button {
    background: transparent;
    color: var(--ink);
    border: 1px solid rgba(28, 23, 18, 0.22);
    border-radius: 999px;
    padding: 6px 12px;
  }
  .card-actions button:hover { border-color: var(--seal); color: var(--seal); }
  .card.kept .card-actions [data-act="keep"] { border-color: var(--seal); color: var(--seal); }
  footer.hints {
    text-align: center;
    color: rgba(243, 234, 215, 0.72);
    font-size: 12px;
    padding: 8px 16px 12px;
    border-top: 1px solid var(--line);
  }
  #statusline { margin: 8px 0 0; color: rgba(243, 234, 215, 0.55); font-size: 13px; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%) translateY(10px);
    background: var(--paper);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: 0.25s ease;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  dialog {
    width: min(680px, calc(100vw - 28px));
    max-height: min(90dvh, 900px);
    overflow: auto;
    border: none;
    padding: 0;
    background: transparent;
  }
  dialog::backdrop { background: rgba(8, 6, 4, 0.72); }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    border: 0;
  }
  #stage::-webkit-scrollbar, #shelf::-webkit-scrollbar { width: 10px; }
  #stage::-webkit-scrollbar-thumb, #shelf::-webkit-scrollbar-thumb {
    background: rgba(243, 234, 215, 0.2);
    border-radius: 99px;
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    #toast { transition: none; }
  }
  @media (max-width: 860px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100dvh; }
    main { grid-template-columns: 1fr; }
    #stage { overflow: visible; }
    #shelf { border-left: none; border-top: 1px solid var(--line); max-height: none; }
    h1 { font-size: 30px; }
    header { padding: 16px 16px 12px; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="app">
  <header>
    <div class="header-row">
      <div class="brand">
        <p class="en">INFINITE CABINET</p>
        <h1>無窮珍奇櫃</h1>
        <p class="lede">一個 HTML，一勞永逸。模型會累，這頁不會。它自己一直發明，直到你把櫃門關上。</p>
        <p id="statusline">正在想起下一件……</p>
      </div>
      <div class="meter" aria-live="off">
        <strong id="count">0</strong>
        <span class="sub">件已生成</span>
        <span class="sub">還能繼續 ∞</span>
      </div>
    </div>
    <div class="toolbar">
      <button type="button" id="pause" aria-pressed="false">暫停</button>
      <button type="button" id="next">再來一件</button>
      <button type="button" id="burst">再來七件</button>
      <button type="button" id="keep-latest">收藏最新</button>
      <label class="speed">節奏
        <span id="speedlabel"></span>
        <input id="speed" type="range" min="900" max="8000" step="100" value="2800" aria-valuemin="900" aria-valuemax="8000" />
      </label>
      <select id="filter" aria-label="接下來只陳列">
        <option value="all">全部展品</option>
      </select>
    </div>
  </header>
  <main>
    <div id="stage">
      <div id="stream" aria-label="展品"></div>
    </div>
    <aside id="shelf" aria-label="收藏架">
      <h2>收藏架</h2>
      <p class="shelf-note">留在這台裝置上。換瀏覽器就換一櫃，這一櫃不會自己消失。</p>
      <div id="shelf-list"></div>
      <div class="shelf-actions">
        <button type="button" id="export">匯出</button>
        <button type="button" id="clear">清空</button>
      </div>
    </aside>
  </main>
  <footer class="hints">空白鍵暫停 · N 下一件 · S 收藏最新 · 單檔、離線也能跑</footer>
</div>
<dialog id="reader" aria-label="展品"></dialog>
<div id="toast" role="status"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<script>
(() => {
  "use strict";

  const KEY = "infinite-cabinet-v1";
  const ORDER = ["story", "poem", "dialogue", "question", "menu", "city", "creature", "star", "color", "invention", "law", "dream", "pattern", "note"];
  const WEIGHTS = [["story", 6], ["poem", 4], ["dialogue", 3], ["question", 3], ["menu", 2], ["city", 2], ["creature", 2], ["star", 2], ["color", 2], ["invention", 2], ["law", 2], ["dream", 2], ["pattern", 1]];
  const KICKERS = {
    story: "微型小說", poem: "短詩", dialogue: "兩句之間", question: "留給你",
    menu: "不存在的菜單", city: "地圖外的城", creature: "博物誌", star: "星圖",
    color: "尚未使用的顏色", invention: "小型發明", law: "另一套法律",
    dream: "夢的說明書", pattern: "失傳圖樣", note: "櫃員留言"
  };
  const SEALS = {
    story: "說", poem: "詩", dialogue: "話", question: "問", menu: "食",
    city: "城", creature: "獸", star: "星", color: "色", invention: "器",
    law: "法", dream: "夢", pattern: "紋", note: "記"
  };

  const PEOPLE = ["阿寧", "老周", "小滿", "陳暮", "何安", "林夏", "江晚", "宋紙", "顧南", "沈燈", "白露", "程野", "葉舟", "許慢", "方棠", "羅針", "溫酌", "韓潮", "梁石", "蔡雲", "丁零", "蘇澄", "高樓", "潘渡", "杜若", "謝秋", "南遲", "祁年", "孟燈", "阮杯"];
  const PLACES = ["北站的長椅", "二十四小時書店的燈下", "河堤", "舊郵局櫃台前", "天橋底下", "社區游泳池的淺水區", "博物館防火梯", "夜間巴士的最後一排", "菜市場收攤後的走道", "屋頂水塔旁邊", "銀行大廳的號碼燈下", "海邊那座不再轉的旋轉木馬", "圖書館閉架區", "醫院走廊的自動販賣機前", "寺廟側門", "地下道的壁畫前", "渡輪甲板", "學校琴房", "空屋的廚房", "天文台的台階"];

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function rng() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function irand(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
  function chance(rng, p) { return rng() < p; }
  function pickWeighted(rng, pairs) {
    let total = 0;
    for (const pair of pairs) total += pair[1];
    let x = rng() * total;
    for (const pair of pairs) {
      x -= pair[1];
      if (x < 0) return pair[0];
    }
    return pairs[pairs.length - 1][0];
  }
  function hslToHex(h, s, l) {
    const hue = ((h % 360) + 360) % 360;
    const sat = s / 100;
    const lig = l / 100;
    const a = sat * Math.min(lig, 1 - lig);
    const f = (n) => {
      const k = (n + hue / 30) % 12;
      const color = lig - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      return Math.round(255 * color).toString(16).padStart(2, "0");
    };
    return "#" + f(0) + f(8) + f(4);
  }
  function twoPeople(rng) {
    const a = pick(rng, PEOPLE);
    let b = pick(rng, PEOPLE);
    let guard = 0;
    while (b === a && guard < 6) {
      b = pick(rng, PEOPLE);
      guard += 1;
    }
    return [a, b];
  }

  const STORY_MAKERS = [
    (rng) => {
      const name = pick(rng, PEOPLE);
      const place = pick(rng, PLACES);
      return { title: "閉館之前", body: `${name}在${place}等到閉館。管理員過來鎖門，卻先問了一句：「你是來還東西的，還是來把東西忘掉的？」${name}想了想，把口袋裡一枚沒有年份的硬幣放上台階，算是兩種都付了一點。` };
    },
    (rng) => {
      const name = pick(rng, PEOPLE);
      const place = pick(rng, PLACES);
      return { title: "昨天的鏡子", body: `${place}出現一面只反射昨天的鏡子。${name}站了很久，看見自己把傘忘在一場還沒開始的雨裡。鏡子裡的人回頭看了一眼，像是在說：至少昨天的你有打算回來拿。` };
    },
    (rng) => {
      const name = pick(rng, PEOPLE);
      const place = pick(rng, PLACES);
      return { title: "抄近路的影子", body: `${name}的影子最近學會抄近路。人還在${place}，影子已經到家，把門鈴按響，然後不好意思地等著。${name}回家時，影子把鞋尖並攏，好像遲到的是主人。` };
    },
    (rng) => {
      const name = pick(rng, PEOPLE);
      const place = pick(rng, PLACES);
      return { title: "多出來的七分鐘", body: `全市的鐘在星期二集體慢了七分鐘。${name}利用這段多出來的時間，去${place}坐著，什麼都沒做。事後覺得這七分鐘比整週都長，長得足夠把一個猶豫放完。` };
    },
    (rng) => {
      const name = pick(rng, PEOPLE);
      const place = pick(rng, PLACES);
      return { title: "心情鑰匙", body: `${name}撿到一串不會開任何鎖的鑰匙。每把鑰匙對應一種心情。最亮的那把，只能在${place}想家的時候轉動半圈。轉完，家並沒有因此更近，但口袋暖了一點。` };
    },
    (rng) => {
      const name = pick(rng, PEOPLE);
      const place = pick(rng, PLACES);
      return { title: "一個字", body: `有人在${place}發傳單，上面只印著一個字：「留」。${name}收下之後，口袋裡的零錢再也沒有走失過。傳單後來自己摺成一艘很小的船，停在錢包的夾層裡。` };
    },
    (rng) => {

    "在舊郵局的抽屜夾層裡找到，邊緣還有一點膠帶。",
    "據說這是某種夜間用的禮紙，白天看不出完整花紋。",
    "博物館不想修復它，因為裂痕也是圖案的一部分。",
    "把它鋪在桌上，杯子會自己找到中心。",
    "沒有人記得這是包裝什麼的。空著，也很好看。"
  ];

  function story(rng) {
    return Object.assign({ visual: null }, pick(rng, STORY_MAKERS)(rng));
  }
  function poem(rng) {
    const cluster = pick(rng, POEMS);
    const lines = cluster.lines.map((row) => pick(rng, row));
    return { title: lines[0], body: lines.slice(1).join("\n"), epigraph: cluster.theme, visual: null };
  }
  function dialogue(rng) {
    const pair = pick(rng, DIALOGUES);
    return { title: pair[0], body: pair[1], visual: null };
  }
  function question(rng) {
    return { title: pick(rng, QUESTIONS), body: pick(rng, NUDGES), visual: null };
  }
  function menu(rng) {
    const pair = pick(rng, MENUS);
    return { title: pair[0], body: pair[1], visual: null };
  }
  function law(rng) {
    return { title: `第 ${irand(rng, 12, 980)} 條`, body: pick(rng, LAWS), visual: null };
  }
  function invention(rng) {
    const pair = pick(rng, INVENTIONS);
    const circles = [];
    const count = irand(rng, 3, 5);
    for (let i = 0; i < count; i += 1) {
      circles.push({ x: 70 + rng() * 400, y: 48 + rng() * 100, r: 14 + rng() * 22 });
    }
    return {
      title: pair[0],
      body: pair[1],
      visual: {
        kind: "blueprint",
        circles,
        gear: { x: 70 + rng() * 420, y: 50 + rng() * 90, r: 16 + rng() * 10 },
        arrow: { x1: 40 + rng() * 80, y1: 150, x2: 180 + rng() * 280, y2: 36 + rng() * 40 }
      }
    };
  }
  function note(rng) {
    const pair = pick(rng, NOTES);
    return { title: pair[0], body: pair[1], visual: null };
  }
  function dream(rng) {
    const thing = pick(rng, DREAM_THINGS);
    const act = pick(rng, DREAM_ACTS);
    const reason = pick(rng, DREAM_REASONS);
    return {
      title: pick(rng, DREAM_TITLES),
      body: `若夢到${thing}，醒來後請${act}。\n\n附註：${reason}。\n若連續三晚相同，把這張說明書摺小，放在枕下，它會自己辭職。`,
      visual: null
    };
  }
  function nameColor(rng, hue) {
    let family = COLOR_FAMILIES[COLOR_FAMILIES.length - 1];
    for (const item of COLOR_FAMILIES) {
      if (hue >= item.h0 && hue < item.h1) {
        family = item;
        break;
      }
    }
    return pick(rng, COLOR_ADJ) + pick(rng, family.nouns);
  }
  function color(rng) {
    const h = rng() * 360;
    const mode = pick(rng, ["analog", "split", "triad"]);
    let hues;
    if (mode === "analog") hues = [h, h + 18, h - 16, h + 34];
    else if (mode === "split") hues = [h, h + 150, h - 150, h + 28];
    else hues = [h, h + 120, h + 240, h + 20];
    const colors = hues.map((hue, index) => {
      const hh = (hue + 360) % 360;
      const s = index === 0 ? 42 + rng() * 28 : 28 + rng() * 35;
      const l = index === 0 ? 42 + rng() * 16 : 24 + rng() * 52;
      const hex = hslToHex(hh, s, l);
      return { name: nameColor(rng, hh), hex };
    });
    return {
      title: colors[0].name,
      body: `${pick(rng, COLOR_USES)}\n其餘的顏色是它的親戚，站在旁邊，沒有搶著說話。`,
      visual: { kind: "swatches", colors }
    };
  }
  function star(rng) {
    const name = pick(rng, STAR_A) + pick(rng, STAR_B);
    const n = irand(rng, 5, 9);
    const pts = [];
    for (let i = 0; i < n; i += 1) {
      pts.push({ x: 36 + rng() * 488, y: 24 + rng() * 150, r: rng() < 0.2 ? 2.6 : 1.35, bright: false });
    }
    pts[0].bright = true;
    pts[0].r = 3.1;
    const links = [];
    for (let i = 0; i < n - 1; i += 1) {
      if (rng() < 0.8) links.push([i, i + 1]);
    }
    if (n > 4 && rng() < 0.55) links.push([0, n - 1]);
    if (links.length === 0) links.push([0, 1]);
    return {
      title: name,
      body: `${pick(rng, STAR_MYTHS)(name)}\n${pick(rng, STAR_VIEWS)}`,
      visual: { kind: "stars", pts, links }
    };
  }
  function city(rng) {
    const name = chance(rng, 0.16) ? pick(rng, CITY_SPECIAL) : pick(rng, CITY_A) + pick(rng, CITY_B);
    const lines = [];
    for (let i = 0; i < 6; i += 1) {
      lines.push({ x1: 16 + rng() * 520, y1: 16 + rng() * 168, x2: 16 + rng() * 520, y2: 16 + rng() * 168 });
    }
    const blocks = [];
    for (let i = 0; i < 4; i += 1) {
      blocks.push({ x: 30 + rng() * 430, y: 24 + rng() * 120, w: 28 + rng() * 50, h: 16 + rng() * 28 });
    }
    return {
      title: name,
      body: `人口　${pick(rng, CITY_POPS)(rng)}\n出口　${pick(rng, CITY_EXPORTS)}\n禁忌　${pick(rng, CITY_TABOOS)}\n天氣　${pick(rng, CITY_WEATHERS)}\n忠告　${pick(rng, CITY_ADVICES)}`,
      visual: {
        kind: "map",
        lines,
        blocks,
        water: 16 + rng() * 140,
        gate: { x: 36 + rng() * 440, y: 28 + rng() * 130 }
      }
    };
  }
  function creature(rng) {
    const cname = pick(rng, C1) + pick(rng, C2);
    const latin = `${pick(rng, GENUS)} ${pick(rng, SPECIES)}`;
    const hue = rng() * 360;
    const radii = [];
    for (let i = 0; i < 10; i += 1) radii.push(0.72 + rng() * 0.38);
    const roll = rng();
    const eyeCount = roll < 0.08 ? 3 : roll < 0.16 ? 1 : 2;
    const eyes = [];
    for (let i = 0; i < eyeCount; i += 1) {
      const spread = (i - (eyeCount - 1) / 2) * 16;
      eyes.push({ x: 100 + spread, y: 70 + rng() * 6, r: 3.2 + rng() * 1.6 });
    }
    const limbs = [];
    const limbCount = irand(rng, 2, 6);
    for (let i = 0; i < limbCount; i += 1) {
      limbs.push({ angle: rng() * Math.PI * 2, len: 18 + rng() * 28, bend: rng() * 16 - 8 });
    }
    const spots = [];
    const spotCount = irand(rng, 0, 5);
    for (let i = 0; i < spotCount; i += 1) {
      spots.push({ x: 78 + rng() * 44, y: 74 + rng() * 28, r: 2 + rng() * 4 });
    }
    return {
      title: cname,
      body: `學名　${latin}\n棲地　${pick(rng, HABITATS)}\n叫聲　像${pick(rng, SOUNDS)}\n筆記　${pick(rng, RUMORS)}\n飼養　不建議。觀看即已足夠。`,
      visual: {
        kind: "creature",
        radii,
        eyes,
        limbs,
        spots,
        pattern: pick(rng, ["plain", "spots", "stripes"]),
        body: hslToHex(hue, 38 + rng() * 20, 42 + rng() * 16),
        belly: hslToHex(hue + 16, 30, 74),
        ink: hslToHex(hue, 25, 18)
      }
    };
  }
  function pattern(rng) {
    const h = rng() * 360;
    const grid = [];
    for (let y = 0; y < 4; y += 1) {
      const row = [];
      for (let x = 0; x < 10; x += 1) row.push(Math.floor(rng() * 5));
      grid.push(row);
    }
    return {
      title: `失傳的包裝紙第 ${irand(rng, 100, 998)} 號`,
      body: pick(rng, PATTERN_NOTES),
      visual: {
        kind: "pattern",
        bg: hslToHex(h, 24, 84),
        ink: hslToHex(h, 30, 28),
        accent: hslToHex(h + 24, 42, 40),
        grid
      }
    };
  }

  const generators = { story, poem, dialogue, question, menu, city, creature, star, color, invention, law, dream, pattern, note };

  function makeItem(type, seed) {
    if (!generators[type]) throw new Error("未知展品");
    const rng = mulberry32(seed >>> 0);
    const item = generators[type](rng);
    item.type = type;
    item.seed = seed >>> 0;
    item.kicker = KICKERS[type];
    if (!item.title) item.title = "無題";
    if (!item.body) item.body = "";
    return item;
  }

  function plainText(item) {
    const parts = [`【${item.kicker}】${item.title}`, "", item.body];
    if (item.epigraph) parts.push("", `· ${item.epigraph} ·`);
    if (item.visual && item.visual.kind === "swatches") {
      parts.push("", item.visual.colors.map((c) => `${c.name}  ${c.hex}`).join("\n"));
    }
    return parts.join("\n").trim() + "\n";
  }

  function serial(seed) {
    return String((seed % 900000) + 100000);
  }

  const state = { speed: 2800, filter: "all", paused: false, timer: null, latest: null, skyId: 0 };
  let lifetime = 0;
  let saved = [];
  let toastTimer = 0;
  const dust = Array.from({ length: 72 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.6 + 0.3,
    a: Math.random() * 0.35 + 0.05,
    s: Math.random() * 0.55 + 0.15
  }));
  const reduceMotion = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function textOn(hex) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255;
    const g = (n >> 8) & 255;
    const b = n & 255;
    const y = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    return y > 0.64 ? "#1c1712" : "#f7f1e4";
  }

  function prepCanvas(canvas, w, h) {
    const dpr = Math.min((typeof devicePixelRatio === "number" ? devicePixelRatio : 1) || 1, 2);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.aspectRatio = `${w} / ${h}`;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return ctx;
  }

  function drawMotif(ctx, cx, cy, id, ink, accent) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = ink;
    ctx.fillStyle = id % 2 ? accent : ink;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    if (id === 0) {
      ctx.arc(0, 0, 4, 0, Math.PI * 2);
      ctx.fill();
    } else if (id === 1) {
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.stroke();
    } else if (id === 2) {
      ctx.moveTo(-10, 0);
      ctx.lineTo(10, 0);
      ctx.moveTo(0, -10);
      ctx.lineTo(0, 10);
      ctx.stroke();
    } else if (id === 3) {
      ctx.arc(0, 0, 12, Math.PI, 0);
      ctx.stroke();
    } else {
      ctx.moveTo(0, -11);
      ctx.lineTo(11, 0);
      ctx.lineTo(0, 11);
      ctx.lineTo(-11, 0);
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }

  function blobPath(pts) {
    const mids = pts.map((p, i) => {
      const n = pts[(i + 1) % pts.length];
      return [(p[0] + n[0]) / 2, (p[1] + n[1]) / 2];
    });
    let d = `M ${mids[0][0].toFixed(1)} ${mids[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length; i += 1) {
      const p = pts[(i + 1) % pts.length];
      const m = mids[(i + 1) % pts.length];
      d += ` Q ${p[0].toFixed(1)} ${p[1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`;
    }
    d += " Z";
    return d;
  }

  function drawVisual(host, visual) {
    if (!visual) return;
    if (visual.kind === "swatches") {
      const wrap = document.createElement("div");
      wrap.className = "swatches";
      visual.colors.forEach((c, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "swatch" + (index === 0 ? " hero" : "");
        btn.style.background = c.hex;
        btn.style.color = textOn(c.hex);
        const name = document.createElement("span");
        name.textContent = c.name;
        const hex = document.createElement("small");
        hex.textContent = c.hex;
        btn.append(name, hex);
        btn.addEventListener("click", () => copyString(`${c.name} ${c.hex}`, "已複製顏色"));
        wrap.append(btn);
      });
      host.append(wrap);
      return;
    }
    if (visual.kind === "creature") {
      const pts = visual.radii.map((rad, i) => {
        const a = (i / visual.radii.length) * Math.PI * 2 - Math.PI / 2;
        return [100 + Math.cos(a) * 46 * rad, 82 + Math.sin(a) * 32 * rad];
      });
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 200 150");
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "想像中的動物");
      const ground = document.createElementNS(svg.namespaceURI, "ellipse");
      ground.setAttribute("cx", "100");
      ground.setAttribute("cy", "132");
      ground.setAttribute("rx", "36");
      ground.setAttribute("ry", "6");
      ground.setAttribute("fill", "rgba(60,40,20,0.15)");
      svg.append(ground);
      visual.limbs.forEach((limb) => {
        const x1 = 100 + Math.cos(limb.angle) * 28;
        const y1 = 96 + Math.sin(limb.angle) * 16;
        const x2 = x1 + Math.cos(limb.angle) * limb.len;
        const y2 = y1 + Math.sin(limb.angle) * limb.len * 0.66;
        const path = document.createElementNS(svg.namespaceURI, "path");
        path.setAttribute("d", `M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${(x1 + limb.bend).toFixed(1)} ${(y1 + 8).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", visual.ink);
        path.setAttribute("stroke-width", "2");
        path.setAttribute("stroke-linecap", "round");
        svg.append(path);
      });
      const body = document.createElementNS(svg.namespaceURI, "path");
      body.setAttribute("d", blobPath(pts));
      body.setAttribute("fill", visual.body);
      svg.append(body);
      const belly = document.createElementNS(svg.namespaceURI, "ellipse");
      belly.setAttribute("cx", "100");
      belly.setAttribute("cy", "96");
      belly.setAttribute("rx", "18");
      belly.setAttribute("ry", "12");
      belly.setAttribute("fill", visual.belly);
      svg.append(belly);
      if (visual.pattern === "stripes") {
        for (let i = 0; i < 4; i += 1) {
          const line = document.createElementNS(svg.namespaceURI, "path");
          const y = 70 + i * 10;
          line.setAttribute("d", `M 78 ${y} Q 100 ${y - 6} 122 ${y}`);
          line.setAttribute("fill", "none");
          line.setAttribute("stroke", visual.ink);
          line.setAttribute("stroke-width", "1");
          line.setAttribute("opacity", "0.35");
          svg.append(line);
        }
      }
      visual.spots.forEach((spot) => {
        const dot = document.createElementNS(svg.namespaceURI, "circle");
        dot.setAttribute("cx", String(spot.x));
        dot.setAttribute("cy", String(spot.y));
        dot.setAttribute("r", String(spot.r));
        dot.setAttribute("fill", visual.ink);
        dot.setAttribute("opacity", "0.28");
        svg.append(dot);
      });
      visual.eyes.forEach((eye) => {
        const white = document.createElementNS(svg.namespaceURI, "circle");
        white.setAttribute("cx", String(eye.x));
        white.setAttribute("cy", String(eye.y));
        white.setAttribute("r", String(eye.r + 1.4));
        white.setAttribute("fill", "#f7f1e4");
        const pupil = document.createElementNS(svg.namespaceURI, "circle");
        pupil.setAttribute("cx", String(eye.x + 0.6));
        pupil.setAttribute("cy", String(eye.y));
        pupil.setAttribute("r", String(Math.max(1.2, eye.r * 0.45)));
        pupil.setAttribute("fill", visual.ink);
        svg.append(white, pupil);
      });
      host.append(svg);
      return;
    }

    const canvas = document.createElement("canvas");
    host.append(canvas);
    if (visual.kind === "stars") {
      const ctx = prepCanvas(canvas, 560, 200);
      ctx.fillStyle = "#141a26";
      ctx.fillRect(0, 0, 560, 200);
      const g = ctx.createRadialGradient(280, 90, 10, 280, 100, 240);
      g.addColorStop(0, "rgba(90, 110, 150, 0.35)");
      g.addColorStop(1, "rgba(20, 26, 38, 0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 560, 200);
      ctx.strokeStyle = "rgba(214, 196, 160, 0.55)";
      ctx.lineWidth = 1;
      visual.links.forEach((link) => {
        const a = visual.pts[link[0]];
        const b = visual.pts[link[1]];
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      });
      visual.pts.forEach((p) => {
        ctx.beginPath();
        ctx.fillStyle = p.bright ? "#fff6e4" : "rgba(255, 246, 228, 0.8)";
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      return;
    }
    if (visual.kind === "blueprint") {
      const ctx = prepCanvas(canvas, 560, 180);
      ctx.clearRect(0, 0, 560, 180);
      ctx.strokeStyle = "rgba(90, 58, 42, 0.8)";
      ctx.fillStyle = "rgba(90, 58, 42, 0.85)";
      ctx.lineWidth = 1.25;
      ctx.strokeRect(10, 10, 540, 160);
      ctx.font = '13px Palatino, "Songti TC", serif';
      ctx.fillText("圖一", 20, 30);
      ctx.beginPath();
      visual.circles.forEach((c, i) => {
        ctx.moveTo(c.x + c.r, c.y);
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        if (i > 0) {
          ctx.moveTo(visual.circles[i - 1].x, visual.circles[i - 1].y);
          ctx.lineTo(c.x, c.y);
        }
      });
      ctx.stroke();
      const gear = visual.gear;
      ctx.beginPath();
      ctx.arc(gear.x, gear.y, gear.r, 0, Math.PI * 2);
      ctx.stroke();
      for (let i = 0; i < 8; i += 1) {
        const a = (i / 8) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(gear.x + Math.cos(a) * (gear.r - 1), gear.y + Math.sin(a) * (gear.r - 1));
        ctx.lineTo(gear.x + Math.cos(a) * (gear.r + 7), gear.y + Math.sin(a) * (gear.r + 7));
        ctx.stroke();
      }
      const ar = visual.arrow;
      ctx.beginPath();
      ctx.moveTo(ar.x1, ar.y1);
      ctx.lineTo(ar.x2, ar.y2);
      ctx.stroke();
      return;
    }
    if (visual.kind === "map") {
      const ctx = prepCanvas(canvas, 560, 200);
      ctx.fillStyle = "#e7d7b8";
      ctx.fillRect(0, 0, 560, 200);
      ctx.fillStyle = "rgba(62, 108, 118, 0.38)";
      ctx.fillRect(0, visual.water, 560, 26);
      ctx.strokeStyle = "rgba(90, 60, 40, 0.28)";
      ctx.lineWidth = 1;
      visual.blocks.forEach((b) => ctx.strokeRect(b.x, b.y, b.w, b.h));
      ctx.strokeStyle = "rgba(90, 60, 40, 0.8)";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      visual.lines.forEach((ln) => {
        ctx.beginPath();
        ctx.moveTo(ln.x1, ln.y1);
        ctx.lineTo(ln.x2, ln.y2);
        ctx.stroke();
      });
      ctx.fillStyle = "#8f2d2d";
      ctx.fillRect(visual.gate.x, visual.gate.y, 8, 8);
      ctx.font = '12px Palatino, "Songti TC", serif';
      ctx.fillText("城門", Math.min(visual.gate.x + 12, 520), visual.gate.y + 8);
      return;
    }
    if (visual.kind === "pattern") {
      const ctx = prepCanvas(canvas, 560, 160);
      ctx.fillStyle = visual.bg;
      ctx.fillRect(0, 0, 560, 160);
      for (let y = 0; y < visual.grid.length; y += 1) {
        for (let x = 0; x < visual.grid[y].length; x += 1) {
          drawMotif(ctx, x * 56 + 28, y * 40 + 20, visual.grid[y][x], visual.ink, visual.accent);
        }
      }
    }
  }

  function isSaved(item) {
    return saved.some((rec) => rec.type === item.type && rec.seed === item.seed);
  }

  function buildCard(item, mode) {
    const art = document.createElement("article");
    art.className = `card type-${item.type}`;
    art.dataset.type = item.type;
    art.dataset.seed = String(item.seed);
    const top = document.createElement("div");
    top.className = "card-top";
    const kicker = document.createElement("span");
    kicker.className = "kicker";
    kicker.textContent = item.kicker;
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = `No. ${serial(item.seed)}`;
    top.append(kicker, num);
    const seal = document.createElement("div");
    seal.className = "seal";
    seal.textContent = SEALS[item.type] || "藏";
    seal.setAttribute("aria-hidden", "true");
    const title = document.createElement("h2");
    title.className = "card-title";
    title.textContent = item.title;
    const body = document.createElement("p");
    body.className = "card-body";
    body.textContent = item.body;
    art.append(top, seal, title, body);
    if (item.epigraph) {
      const epi = document.createElement("p");
      epi.className = "epigraph";
      epi.textContent = `· ${item.epigraph} ·`;
      art.append(epi);
    }
    if (item.visual) {
      const vis = document.createElement("div");
      vis.className = `visual ${item.visual.kind}`;
      drawVisual(vis, item.visual);
      art.append(vis);
    }
    const actions = document.createElement("div");
    actions.className = "card-actions";
    const keep = document.createElement("button");
    keep.type = "button";
    keep.dataset.act = "keep";
    keep.textContent = isSaved(item) ? "已收藏" : "收入收藏";
    keep.addEventListener("click", () => saveItem(item));
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "複製";
    copy.addEventListener("click", () => copyString(plainText(item), "已複製這一件"));
    actions.append(keep, copy);
    if (mode === "reader") {
      const close = document.createElement("button");
      close.type = "button";
      close.textContent = "闔上";
      close.addEventListener("click", () => document.getElementById("reader").close());
      actions.append(close);
    }
    art.append(actions);
    art.classList.toggle("kept", isSaved(item));
    return art;
  }

  function refreshKeepButtons() {
    document.querySelectorAll(".card").forEach((card) => {
      const on = saved.some((rec) => rec.type === card.dataset.type && rec.seed === Number(card.dataset.seed));
      const btn = card.querySelector("[data-act='keep']");
      if (btn) btn.textContent = on ? "已收藏" : "收入收藏";
      card.classList.toggle("kept", on);
    });
  }

  function materialize(rec) {
    try {
      const item = makeItem(rec.type, rec.seed >>> 0);
      item.savedAt = rec.savedAt || 0;
      return item;
    } catch (err) {
      return null;
    }
  }

  function renderShelf() {
    const list = document.getElementById("shelf-list");
    list.replaceChildren();
    if (!saved.length) {
      const p = document.createElement("p");
      p.className = "empty-shelf";
      p.textContent = "還沒有留下東西。遇到捨不得的，就收進來。";
      list.append(p);
      return;
    }
    const items = saved.map(materialize).filter(Boolean).sort((a, b) => b.savedAt - a.savedAt);
    items.forEach((item) => {
      const row = document.createElement("div");
      row.className = "shelf-row";
      const open = document.createElement("button");
      open.type = "button";
      open.className = "shelf-item";
      const small = document.createElement("small");
      small.textContent = item.kicker;
      const strong = document.createElement("strong");
      strong.textContent = item.title;
      open.append(small, strong);
      open.addEventListener("click", () => openReader(item));
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "icon-btn";
      remove.setAttribute("aria-label", `移出${item.title}`);
      remove.textContent = "×";
      remove.addEventListener("click", () => saveItem(item));
      row.append(open, remove);
      list.append(row);
    });
  }

  function openReader(item) {
    const dlg = document.getElementById("reader");
    dlg.replaceChildren(buildCard(item, "reader"));
    if (typeof dlg.showModal === "function") dlg.showModal();
    else dlg.setAttribute("open", "");
  }

  function toast(message) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  async function copyString(text, ok) {
    let done = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        done = true;
      }
    } catch (err) {
      done = false;
    }
    if (!done) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.append(ta);
      ta.select();
      try { done = document.execCommand("copy"); } catch (err) { done = false; }
      ta.remove();
    }
    toast(done ? ok : "沒能複製，請手動選取");
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        v: 1,
        lifetime,
        speed: state.speed,
        filter: state.filter,
        saved
      }));
    } catch (err) {
      toast("這台裝置沒有把收藏留住");
    }
  }

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "null");
      if (!raw || typeof raw !== "object") return;
      if (Number.isFinite(raw.lifetime) && raw.lifetime >= 0) lifetime = Math.floor(raw.lifetime);
      if (Number.isFinite(raw.speed)) state.speed = Math.min(8000, Math.max(900, raw.speed));
      if (typeof raw.filter === "string" && (raw.filter === "all" || KICKERS[raw.filter])) state.filter = raw.filter;
      if (Array.isArray(raw.saved)) {
        saved = raw.saved.filter((rec) => rec && KICKERS[rec.type] && Number.isFinite(rec.seed)).slice(0, 200);
      }
    } catch (err) {
      saved = [];
    }
  }

  function randSeed() {
    const cryptoObj = globalThis.crypto;
    if (cryptoObj && cryptoObj.getRandomValues) {
      const buf = new Uint32Array(1);
      cryptoObj.getRandomValues(buf);
      return buf[0];
    }
    return Math.floor(Math.random() * 4294967296);
  }

  function pushNew(forceType) {
    lifetime += 1;
    let type = forceType || null;
    if (!type) {
      if (state.filter !== "all") type = state.filter;
      else if (lifetime % 40 === 0) type = "note";
      else type = pickWeighted(Math.random, WEIGHTS);
    }
    let item;
    try {
      item = makeItem(type, randSeed());
    } catch (err) {
      item = makeItem("note", randSeed());
    }
    state.latest = item;
    const stage = document.getElementById("stage");
    const stream = document.getElementById("stream");
    const stick = stage.scrollTop < 16;
    const prev = stage.scrollHeight;
    stream.prepend(buildCard(item));
    while (stream.children.length > 36) stream.lastElementChild.remove();
    if (!stick) stage.scrollTop += stage.scrollHeight - prev;
    document.getElementById("count").textContent = lifetime.toLocaleString("zh-Hant");
    document.getElementById("live").textContent = `新展品：${item.kicker}，${item.title}`;
    document.title = `${item.title} · 無窮珍奇櫃`;
    persist();
  }

  function saveItem(item) {
    const idx = saved.findIndex((rec) => rec.type === item.type && rec.seed === item.seed);
    if (idx >= 0) {
      saved.splice(idx, 1);
      toast("已從收藏架取下");
    } else {
      if (saved.length >= 200) {
        toast("收藏架滿了，先移出一件");
        return;
      }
      saved.unshift({ type: item.type, seed: item.seed >>> 0, savedAt: Date.now() });
      toast("已收入收藏");
    }
    persist();
    renderShelf();
    refreshKeepButtons();
  }

  function updateSpeedLabel() {
    document.getElementById("speedlabel").textContent = `每 ${(state.speed / 1000).toFixed(1)} 秒`;
  }

  function syncTimer() {
    if (state.timer) clearInterval(state.timer);
    state.timer = null;
    if (!state.paused && !document.hidden) state.timer = setInterval(() => pushNew(), state.speed);
    const btn = document.getElementById("pause");
    btn.textContent = state.paused ? "繼續" : "暫停";
    btn.setAttribute("aria-pressed", state.paused ? "true" : "false");
    document.getElementById("statusline").textContent = state.paused
      ? "櫃門暫且掩上。按空白鍵可以再打開。"
      : "正在想起下一件……";
  }

  function projectArm(x, y, z, rot) {
    const cy = Math.cos(rot);
    const sy = Math.sin(rot);
    const x1 = x * cy - z * sy;
    const z1 = x * sy + z * cy;
    const cx = Math.cos(rot * 0.7);
    const sx = Math.sin(rot * 0.7);
    const y1 = y * cx - z1 * sx;
    const z2 = y * sx + z1 * cx;
    const f = 240 / (240 + z2);
    return [x1 * f, y1 * f];
  }

  function drawSky(ts) {
    const canvas = document.getElementById("sky");
    if (!canvas) return;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
    }
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const glow = ctx.createRadialGradient(w * 0.72, h * 0.18, 0, w * 0.5, h * 0.4, Math.max(w, h) * 0.7);
    glow.addColorStop(0, "rgba(62, 48, 32, 0.55)");
    glow.addColorStop(1, "rgba(18, 16, 14, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    if (!reduceMotion) {
      dust.forEach((p) => {
        p.y -= 0.00012 * p.s;
        if (p.y < 0) p.y += 1;
      });
    }
    dust.forEach((p) => {
      ctx.globalAlpha = p.a;
      ctx.fillStyle = "#e6d3ae";
      ctx.fillRect(p.x * w, (p.y % 1) * h, p.r, p.r);
    });
    ctx.globalAlpha = 1;
    if (w >= 860) {
      const rot = reduceMotion ? 0.6 : ts * 0.00005;
      const R = Math.min(w, h) * 0.22;
      ctx.save();
      ctx.translate(w * 0.8, h * 0.46);
      ctx.strokeStyle = "rgba(166, 132, 74, 0.28)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i += 1) {
        ctx.beginPath();
        const tilt = i * 0.55 + rot;
        for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.15) {
          const x = Math.cos(a) * R;
          const y = Math.sin(a) * R * Math.cos(tilt);
          const z = Math.sin(a) * R * Math.sin(tilt);
          const p = projectArm(x, y, z, rot);
          if (a === 0) ctx.moveTo(p[0], p[1]);
          else ctx.lineTo(p[0], p[1]);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    state.skyId = requestAnimationFrame(drawSky);
  }

  function startSky() {
    if (!state.skyId) state.skyId = requestAnimationFrame(drawSky);
  }
  function stopSky() {
    if (state.skyId) cancelAnimationFrame(state.skyId);
    state.skyId = 0;
  }

  function exportSaved() {
    const items = saved.map(materialize).filter(Boolean);
    if (!items.length) {
      toast("收藏架還是空的");
      return;
    }
    const chunks = items.map((item) => plainText(item).trim());
    const text = `無窮珍奇櫃 · 收藏\n共 ${items.length} 件\n\n${chunks.join("\n\n———\n\n")}\n`;
    const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "無窮珍奇櫃-收藏.txt";
    document.body.append(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function boot() {
    load();
    const filter = document.getElementById("filter");
    ORDER.forEach((id) => {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = KICKERS[id];
      filter.append(opt);
    });
    filter.value = state.filter;
    document.getElementById("speed").value = String(state.speed);
    updateSpeedLabel();
    renderShelf();
    document.getElementById("count").textContent = lifetime.toLocaleString("zh-Hant");
    for (let i = 0; i < 3; i += 1) pushNew();
    syncTimer();
    startSky();

    document.getElementById("pause").addEventListener("click", () => {
      state.paused = !state.paused;
      syncTimer();
    });
    document.getElementById("next").addEventListener("click", () => pushNew());
    document.getElementById("burst").addEventListener("click", () => {
      for (let i = 0; i < 7; i += 1) pushNew();
    });
    document.getElementById("keep-latest").addEventListener("click", () => {
      if (state.latest) saveItem(state.latest);
    });
    document.getElementById("speed").addEventListener("input", (event) => {
      state.speed = Number(event.target.value);
      updateSpeedLabel();
      persist();
      syncTimer();
    });
    filter.addEventListener("change", () => {
      state.filter = filter.value;
      persist();
    });
    document.getElementById("export").addEventListener("click", exportSaved);
    document.getElementById("clear").addEventListener("click", () => {
      if (!saved.length) {
        toast("收藏架本來就是空的");
        return;
      }
      if (!confirm("清空收藏架？此動作不能復原。")) return;
      saved = [];
      persist();
      renderShelf();
      refreshKeepButtons();
      toast("收藏架已清空");
    });
    document.getElementById("reader").addEventListener("click", (event) => {
      if (event.target.id === "reader") event.target.close();
    });
    document.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      const dlg = document.getElementById("reader");
      if (dlg.open) return;
      if (event.target.closest("input, textarea, select")) return;
      if (event.code === "Space") {
        event.preventDefault();
        state.paused = !state.paused;
        syncTimer();
      } else if (event.key === "n" || event.key === "N") {
        pushNew();
      } else if ((event.key === "s" || event.key === "S") && state.latest) {
        saveItem(state.latest);
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (state.timer) clearInterval(state.timer);
        state.timer = null;
        stopSky();
      } else {
        startSky();
        syncTimer();
      }
    });
  }

  if (typeof document === "undefined") {
    globalThis.__CABINET__ = { makeItem, ORDER, KICKERS, mulberry32, plainText };
  } else {
    try {
      boot();
    } catch (err) {
      console.error(err);
      const p = document.createElement("p");
      p.className = "lede";
      p.textContent = "櫃門卡住了，請重新開啟這頁。";
      document.body.append(p);
    }
  }
})();
</script>
</body>
</html>
