<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF 獎狀生成器 Pro (精準定位修正版)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF Lib -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4/dist/fontkit.umd.min.js"></script>
    
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // 設定 PDF.js Worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }
        
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans TC', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body, html { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        .canvas-container {
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            line-height: 0;
            position: relative;
        }
        .layer-item.active {
            background-color: #eff6ff;
            border-left: 4px solid #2563eb;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        
        .style-btn.active {
            background-color: #eff6ff; color: #2563eb; border-color: #60a5fa; font-weight: bold;
        }

        .mode-toggle-btn {
            flex: 1;
            padding: 6px 0;
            font-size: 0.75rem;
            text-align: center;
            cursor: pointer;
            border: 1px solid #cbd5e1;
            background-color: white;
            color: #64748b;
            transition: all 0.2s;
        }
        .mode-toggle-btn:first-child {
            border-top-left-radius: 0.375rem;
            border-bottom-left-radius: 0.375rem;
            border-right-width: 0;
        }
        .mode-toggle-btn:last-child {
            border-top-right-radius: 0.375rem;
            border-bottom-right-radius: 0.375rem;
        }
        .mode-toggle-btn.active {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
            font-weight: bold;
        }
        
        #pdfCanvas {
            display: block;
            max-width: none;
        }
        
        /* Loading overlay */
        .loading-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; backdrop-filter: blur(2px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 relative">

    <!-- 1. Header -->
    <header class="bg-white border-b border-slate-200 px-4 h-14 flex items-center justify-between shrink-0 z-50 relative">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 text-white w-8 h-8 rounded flex items-center justify-center">
                <i class="fa-solid fa-award"></i>
            </div>
            <h1 class="text-base font-bold text-slate-900">PDF 獎狀 Pro <span class="text-xs font-normal text-slate-500 bg-slate-100 px-2 py-0.5 rounded ml-2">精準定位版 v2</span></h1>
        </div>
        <div>
             <label class="cursor-pointer bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded text-xs font-medium transition flex items-center gap-2 border border-slate-300">
                <i class="fa-solid fa-folder-open text-blue-600"></i>
                <span class="hidden md:inline">更換模板</span>
                <input type="file" id="pdfUpload" accept=".pdf" class="hidden"/>
            </label>
        </div>
    </header>

    <!-- 2. Main Layout -->
    <div class="absolute top-14 bottom-0 left-0 right-0 flex flex-col md:flex-row-reverse overflow-hidden">
        
        <!-- A. Preview Area -->
        <main class="flex-1 bg-slate-200/50 relative overflow-hidden flex flex-col h-[45%] md:h-auto border-b md:border-b-0 md:border-l border-slate-300">
            <div id="previewContainer" class="flex-1 w-full h-full flex items-center justify-center p-4 relative overflow-auto">
                <div id="placeholder" class="text-center text-slate-400 p-6 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50">
                    <i class="fa-regular fa-file-pdf text-3xl mb-2"></i>
                    <p class="text-sm">請上傳模板</p>
                </div>
                <!-- Wrapper MUST have exact size as canvas to position overlay correctly -->
                <div id="canvasWrapper" class="canvas-container hidden">
                    <canvas id="pdfCanvas"></canvas>
                    <div id="overlayLayer" class="absolute inset-0 pointer-events-none"></div>
                </div>
                <div id="loadingOverlay" class="loading-overlay hidden">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
                    <div id="loadingText" class="text-xs font-bold text-slate-600">處理中...</div>
                </div>
            </div>
            <div class="absolute bottom-4 right-4 flex bg-white/90 backdrop-blur rounded-lg shadow border border-slate-200 overflow-hidden z-20">
                <button id="zoomOut" class="p-2 w-10 flex justify-center hover:bg-slate-50 text-slate-600 border-r"><i class="fa-solid fa-minus text-xs"></i></button>
                <span id="zoomLevel" class="w-12 flex justify-center items-center text-[10px] font-mono">100%</span>
                <button id="zoomIn" class="p-2 w-10 flex justify-center hover:bg-slate-50 text-slate-600 border-l"><i class="fa-solid fa-plus text-xs"></i></button>
            </div>
            
            <div id="debugInfo" class="absolute bottom-4 left-4 text-[10px] text-slate-400 font-mono hidden md:block opacity-50 pointer-events-none">
                XY: 0, 0
            </div>
        </main>

        <!-- B. Controls Sidebar -->
        <aside class="w-full md:w-96 bg-white flex flex-col shadow-xl z-30 h-[55%] md:h-full relative">
            
            <!-- Font & Tabs -->
            <div class="border-b border-slate-100 bg-slate-50 shrink-0">
                <div class="px-3 py-2 flex items-center gap-2 border-b border-slate-100">
                    <i class="fa-solid fa-font text-slate-400 text-xs"></i>
                    <select id="fontSelector" class="flex-1 py-1 px-2 border border-slate-300 rounded text-xs bg-white outline-none">
                        <option value="noto-sans-tc">Noto Sans TC (繁體黑體)</option>
                        <option value="upload-custom">自訂字型...</option>
                    </select>
                    <input type="file" id="fontFileInput" accept=".ttf,.otf" class="hidden">
                    <div id="fontStatus" class="hidden text-green-600 text-xs"><i class="fa-solid fa-check"></i></div>
                </div>
                <div class="flex">
                    <button class="flex-1 py-2 text-xs font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50" id="tabEditor">編輯模式</button>
                    <button class="flex-1 py-2 text-xs font-bold text-slate-500 hover:bg-slate-50" id="tabBatch">批次模式</button>
                </div>
            </div>

            <!-- Settings Content -->
            <div class="flex-1 overflow-y-auto relative bg-white">
                
                <!-- Properties Panel -->
                <div id="propertiesPanel" class="p-3 border-b border-slate-100 bg-slate-50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-slate-500 flex items-center gap-1"><i class="fa-solid fa-sliders"></i> <span id="propPanelTitle">屬性</span></span>
                        <button id="deleteLayerBtn" class="text-[10px] text-red-500 border border-red-200 px-2 py-0.5 rounded hover:bg-red-50">刪除</button>
                    </div>

                    <!-- Text Mode Switcher -->
                    <div class="flex mb-2">
                        <button type="button" class="mode-toggle-btn active" id="btnModeNormal">普通文字</button>
                        <button type="button" class="mode-toggle-btn" id="btnModeGroup">名單群組</button>
                    </div>

                    <!-- Group Options -->
                    <div id="groupOptions" class="hidden mb-2 bg-blue-50 p-2 rounded border border-blue-100">
                        <div class="text-[10px] text-blue-600 mb-1 font-bold">群組排版 (用逗號分隔)：</div>
                        <div class="flex gap-2 mb-2">
                            <label class="flex items-center gap-1 cursor-pointer text-[10px] text-blue-800">
                                <input type="radio" name="groupLayout" value="v" class="accent-blue-600"> 垂直分行
                            </label>
                            <label class="flex items-center gap-1 cursor-pointer text-[10px] text-blue-800">
                                <input type="radio" name="groupLayout" value="h" class="accent-blue-600"> 水平同列
                            </label>
                        </div>
                        
                        <div id="groupSpacingControl" class="hidden border-t border-blue-100 pt-1 mt-1">
                            <div class="flex justify-between text-[10px] text-blue-800 mb-1"><span>水平間距 (空格數)</span><span id="propGroupSpacingLabel">4</span></div>
                            <input type="range" id="propGroupSpacingRange" min="1" max="20" step="1" class="w-full h-1 bg-blue-200 rounded-lg appearance-none cursor-pointer accent-blue-600 block">
                        </div>
                    </div>
                    
                    <div id="propTextWrapper" class="mb-2 relative">
                        <textarea id="propText" rows="1" class="w-full px-2 py-1 border border-slate-300 rounded text-sm focus:border-blue-500 outline-none resize-none" placeholder="輸入內容..."></textarea>
                        <div id="groupHint" class="hidden absolute right-2 bottom-1 text-[9px] text-slate-400 pointer-events-none">範例: A, B, C</div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <div class="bg-white border rounded p-1">
                            <div class="flex justify-between text-[10px] text-slate-400"><span>大小</span><span id="propSizeLabel">50</span></div>
                            <input type="range" id="propSizeRange" min="8" max="200" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 block mt-1">
                        </div>
                        <div class="bg-white border rounded p-1">
                            <div class="flex justify-between text-[10px] text-slate-400"><span>行距</span><span id="propLineHeightLabel">1.2</span></div>
                            <input type="range" id="propLineHeightRange" min="0.8" max="3.0" step="0.1" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 block mt-1">
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <button id="btnBold" class="style-btn flex-1 py-1 border border-slate-300 rounded bg-white text-xs font-bold">B</button>
                        <button id="btnItalic" class="style-btn flex-1 py-1 border border-slate-300 rounded bg-white text-xs italic">I</button>
                        <div class="flex-1 relative border border-slate-300 rounded bg-white overflow-hidden h-7">
                            <input type="color" id="propColor" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
                            <div class="w-full h-full flex items-center justify-center"><div id="colorIndicator" class="w-3 h-3 rounded-full bg-black border"></div></div>
                        </div>
                        <div class="flex-1 relative border border-slate-300 rounded bg-white overflow-hidden h-7 flex items-center px-1">
                            <span class="text-[10px] text-slate-400 mr-1">X</span>
                            <input type="number" id="propX" class="w-full text-xs outline-none bg-transparent">
                        </div>
                        <div class="flex-1 relative border border-slate-300 rounded bg-white overflow-hidden h-7 flex items-center px-1">
                            <span class="text-[10px] text-slate-400 mr-1">Y</span>
                            <input type="number" id="propY" class="w-full text-xs outline-none bg-transparent">
                        </div>
                    </div>
                </div>

                <!-- Mode Content -->
                <div class="p-3 pb-24"> 
                    <div id="panelEditor">
                        <h4 class="text-[10px] font-bold text-slate-400 mb-2 uppercase">圖層列表</h4>
                        <div id="layersList" class="space-y-1.5 mb-3"></div>
                        <button id="addLayerBtn" class="w-full py-2 border border-dashed border-slate-300 text-slate-500 rounded text-xs hover:text-blue-600 hover:bg-slate-50">
                            + 新增文字
                        </button>
                    </div>

                    <div id="panelBatch" class="hidden h-full flex flex-col">
                        <div class="bg-blue-50 border-l-2 border-blue-500 p-2 text-xs text-blue-800 mb-2">
                            <i class="fa-solid fa-circle-info"></i> 設定好「第1欄位」的樣式（如群組排版）後，在下方輸入名單。
                        </div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-slate-500">名單輸入 (一行一份)</span>
                            <span id="nameCount" class="text-[10px] bg-slate-100 px-2 rounded-full text-slate-500">0</span>
                        </div>
                        <textarea id="batchNamesInput" class="w-full h-40 p-2 border border-slate-300 rounded text-sm leading-relaxed focus:border-blue-500 outline-none font-mono resize-none" placeholder="範例：&#10;王小明, 李大同 (群組模式會自動排版)&#10;陳雅婷 (單人)"></textarea>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="p-3 border-t border-slate-200 bg-white absolute bottom-0 left-0 right-0 z-40">
                <button id="downloadBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded shadow transition flex items-center justify-center gap-2 disabled:opacity-50 text-sm">
                    <i class="fa-solid fa-download"></i> <span id="downloadBtnText">下載 PDF</span>
                </button>
            </div>
        </aside>
    </div>

    <script>
        // --- Core State ---
        const AppState = {
            pdfBytes: null, pdfDoc: null, fontBytes: null, fontName: 'none', fontType: 'sans',
            pdfDocDims: { width: 0, height: 0 }, 
            scale: 1.0,  // Base scale (fit to screen)
            zoom: 1.0,   // User zoom level
            pixelRatio: 1.0, // Critical: Canvas CSS Pixels / PDF Points Ratio
            layers: [], activeLayerId: null, mode: 'editor', tempLayerText: null
        };

        let PDFLib, fontkit, PDFDocument, rgb;

        // --- Elements ---
        const els = {
            pdfUpload: document.getElementById('pdfUpload'),
            fontSelector: document.getElementById('fontSelector'),
            fontFileInput: document.getElementById('fontFileInput'),
            fontStatus: document.getElementById('fontStatus'),
            layersList: document.getElementById('layersList'),
            addLayerBtn: document.getElementById('addLayerBtn'),
            deleteLayerBtn: document.getElementById('deleteLayerBtn'),
            propPanel: document.getElementById('propertiesPanel'),
            propPanelTitle: document.getElementById('propPanelTitle'),
            propTextWrapper: document.getElementById('propTextWrapper'),
            groupOptions: document.getElementById('groupOptions'),
            groupHint: document.getElementById('groupHint'),
            groupSpacingControl: document.getElementById('groupSpacingControl'),
            btnModeNormal: document.getElementById('btnModeNormal'),
            btnModeGroup: document.getElementById('btnModeGroup'),
            inputs: {
                text: document.getElementById('propText'),
                size: document.getElementById('propSize'), sizeRange: document.getElementById('propSizeRange'), sizeLabel: document.getElementById('propSizeLabel'),
                lineHeight: document.getElementById('propLineHeight'), lineHeightRange: document.getElementById('propLineHeightRange'), lineHeightLabel: document.getElementById('propLineHeightLabel'),
                x: document.getElementById('propX'), y: document.getElementById('propY'),
                color: document.getElementById('propColor'), colorIndicator: document.getElementById('colorIndicator'),
                bold: document.getElementById('btnBold'), italic: document.getElementById('btnItalic'),
                groupSpacingRange: document.getElementById('propGroupSpacingRange'), groupSpacingLabel: document.getElementById('propGroupSpacingLabel')
            },
            groupLayoutRadios: document.getElementsByName('groupLayout'),
            canvas: document.getElementById('pdfCanvas'),
            overlay: document.getElementById('overlayLayer'),
            wrapper: document.getElementById('canvasWrapper'),
            placeholder: document.getElementById('placeholder'),
            downloadBtn: document.getElementById('downloadBtn'),
            downloadBtnText: document.getElementById('downloadBtnText'),
            tabEditor: document.getElementById('tabEditor'), tabBatch: document.getElementById('tabBatch'),
            panelEditor: document.getElementById('panelEditor'), panelBatch: document.getElementById('panelBatch'),
            batchInput: document.getElementById('batchNamesInput'), nameCount: document.getElementById('nameCount'),
            zoomIn: document.getElementById('zoomIn'), zoomOut: document.getElementById('zoomOut'), zoomLevel: document.getElementById('zoomLevel'),
            previewContainer: document.getElementById('previewContainer'),
            debugInfo: document.getElementById('debugInfo'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            loadingText: document.getElementById('loadingText')
        };

        // --- Init ---
        window.onload = function() {
            if (window.PDFLib) {
                PDFLib = window.PDFLib;
                fontkit = window.fontkit;
                PDFDocument = PDFLib.PDFDocument;
                rgb = PDFLib.rgb;
                // Auto load font
                loadWebFont('noto-sans-tc');
            } else {
                alert("元件載入失敗，請檢查網路。");
            }
        };

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { if (AppState.pdfDoc) renderPdf(true); }, 200);
        });

        // --- PDF Logic ---
        els.pdfUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                showLoading(true, "解析 PDF...");
                const buffer = await file.arrayBuffer();
                AppState.pdfBytes = new Uint8Array(buffer);
                AppState.pdfDoc = null; AppState.layers = []; AppState.zoom = 1.0;
                await renderPdf();
                if (AppState.layers.length === 0) {
                    addLayer("獲獎人姓名", AppState.pdfDocDims.width/2, AppState.pdfDocDims.height/2 + 50);
                }
                updateUI();
                showLoading(false);
            } catch (err) {
                console.error(err);
                alert("PDF 載入失敗");
                els.placeholder.innerHTML = "載入失敗";
                showLoading(false);
            }
        });

        function showLoading(show, text="處理中...") {
            if(show) {
                els.loadingOverlay.classList.remove('hidden');
                els.loadingText.innerText = text;
            } else {
                els.loadingOverlay.classList.add('hidden');
            }
        }

        const FONTS = {
            'noto-sans-tc': 'https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tc@4.5.12/files/noto-sans-tc-chinese-traditional-400-normal.woff'
        };

        els.fontSelector.addEventListener('change', async (e) => {
            const val = e.target.value;
            if (val.startsWith('upload')) els.fontFileInput.click();
            else await loadWebFont(val);
        });

        els.fontFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                AppState.fontBytes = ev.target.result;
                AppState.fontName = file.name;
                AppState.fontType = 'custom';
                els.fontStatus.classList.remove('hidden');
                renderOverlay();
            };
            reader.readAsArrayBuffer(file);
        });

        async function loadWebFont(key) {
            els.fontStatus.classList.add('hidden');
            try {
                const resp = await fetch(FONTS[key]);
                if (!resp.ok) throw new Error("DL Fail");
                AppState.fontBytes = await resp.arrayBuffer();
                AppState.fontName = "Noto Sans TC";
                AppState.fontType = 'sans';
                els.fontStatus.classList.remove('hidden');
                renderOverlay();
            } catch (err) { console.error(err); }
        }

        async function renderPdf(isResize = false) {
            if (!AppState.pdfBytes) return;
            if (!AppState.pdfDoc) {
                const loadingTask = pdfjsLib.getDocument({
                    data: AppState.pdfBytes,
                    cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/cmaps/',
                    cMapPacked: true,
                });
                AppState.pdfDoc = await loadingTask.promise;
                const p = await AppState.pdfDoc.getPage(1);
                const vp = p.getViewport({ scale: 1.0 }); 
                AppState.pdfDocDims = { width: vp.width, height: vp.height };
            }
            els.placeholder.classList.add('hidden');
            els.wrapper.classList.remove('hidden');
            
            const page = await AppState.pdfDoc.getPage(1);
            const containerW = els.previewContainer.clientWidth;
            const containerH = els.previewContainer.clientHeight;
            const safeW = containerW - 40; 
            const safeH = containerH - 40;
            const vpRaw = page.getViewport({ scale: 1.0 });
            
            const scaleW = safeW / vpRaw.width;
            const scaleH = safeH / vpRaw.height;
            AppState.scale = Math.min(scaleW, scaleH);
            
            if(AppState.scale <= 0) AppState.scale = 0.5;
            
            await updateCanvas();
        }

        async function updateCanvas() {
            if (!AppState.pdfDoc) return;
            const page = await AppState.pdfDoc.getPage(1);
            
            const totalScale = AppState.scale * AppState.zoom;
            const viewport = page.getViewport({ scale: totalScale });
            
            els.canvas.width = viewport.width;
            els.canvas.height = viewport.height;
            
            els.canvas.style.width = `${viewport.width}px`;
            els.canvas.style.height = `${viewport.height}px`;
            els.wrapper.style.width = `${viewport.width}px`;
            els.wrapper.style.height = `${viewport.height}px`;
            
            AppState.pixelRatio = viewport.width / AppState.pdfDocDims.width;

            const ctx = els.canvas.getContext('2d');
            await page.render({ canvasContext: ctx, viewport }).promise;
            
            renderOverlay();
            updateZoomLabel();
        }

        // --- Layers ---
        function addLayer(text, x, y) {
            const id = Date.now().toString();
            AppState.layers.push({ 
                id, text, 
                x: x || 100, 
                y: y || 100, 
                size: 24, 
                lineHeight: 1.2, 
                color: "#000000", isBold: false, isItalic: false,
                mode: 'normal', groupLayout: 'v', groupSpacing: 4 
            });
            setActiveLayer(id); renderLayerList(); renderOverlay();
        }
        function deleteLayer(id) {
            AppState.layers = AppState.layers.filter(l => l.id !== id);
            if (AppState.activeLayerId === id) AppState.activeLayerId = AppState.layers.length > 0 ? AppState.layers[0].id : null;
            renderLayerList(); renderOverlay(); updateUI();
        }
        function setActiveLayer(id) {
            AppState.activeLayerId = id;
            renderLayerList(); renderOverlay(); updateUI();
        }
        function renderLayerList() {
            els.layersList.innerHTML = '';
            AppState.layers.forEach((layer, index) => {
                const div = document.createElement('div');
                div.className = `layer-item p-2 rounded border border-transparent cursor-pointer hover:bg-slate-50 transition flex items-center justify-between group ${layer.id === AppState.activeLayerId ? 'active' : 'bg-white border-slate-100 shadow-sm'}`;
                const title = (layer.text.split('\n')[0] || '...').substring(0, 15);
                const badge = layer.mode === 'group' ? '<span class="text-[9px] bg-blue-100 text-blue-700 px-1 rounded ml-1">群</span>' : '';
                div.innerHTML = `<div class="flex items-center gap-2 overflow-hidden w-full"><span class="text-slate-400 text-[10px] w-3 shrink-0">${index+1}</span><span class="text-xs font-bold text-slate-700 truncate">${title}</span>${badge}</div>`;
                div.onclick = () => setActiveLayer(layer.id);
                els.layersList.appendChild(div);
            });
        }

        function updateUI() {
            const l = AppState.layers.find(x => x.id === AppState.activeLayerId);
            if (!l) return;
            const i = els.inputs;
            
            if (l.mode === 'group') {
                els.btnModeNormal.classList.remove('active');
                els.btnModeGroup.classList.add('active');
                els.groupOptions.classList.remove('hidden');
                els.groupHint.classList.remove('hidden');
                els.groupLayoutRadios.forEach(r => r.checked = (r.value === l.groupLayout));
                if (l.groupLayout === 'h') els.groupSpacingControl.classList.remove('hidden');
                else els.groupSpacingControl.classList.add('hidden');
            } else {
                els.btnModeNormal.classList.add('active');
                els.btnModeGroup.classList.remove('active');
                els.groupOptions.classList.add('hidden');
                els.groupHint.classList.add('hidden');
            }

            if(document.activeElement !== i.text) i.text.value = l.text;
            if(document.activeElement !== i.size) i.size.value = l.size;
            if(document.activeElement !== i.sizeRange) i.sizeRange.value = l.size;
            i.sizeLabel.innerText = l.size;
            if(document.activeElement !== i.groupSpacingRange) i.groupSpacingRange.value = l.groupSpacing || 4;
            i.groupSpacingLabel.innerText = l.groupSpacing || 4;
            if(document.activeElement !== i.lineHeight) i.lineHeight.value = l.lineHeight;
            if(document.activeElement !== i.lineHeightRange) i.lineHeightRange.value = l.lineHeight;
            i.lineHeightLabel.innerText = l.lineHeight;
            if(document.activeElement !== i.x) i.x.value = Math.round(l.x);
            if(document.activeElement !== i.y) i.y.value = Math.round(l.y);
            i.color.value = l.color; i.colorIndicator.style.backgroundColor = l.color;
            if(l.isBold) i.bold.classList.add('active'); else i.bold.classList.remove('active');
            if(l.isItalic) i.italic.classList.add('active'); else i.italic.classList.remove('active');
        }

        function updateLayer(key, val) {
            const l = AppState.layers.find(x => x.id === AppState.activeLayerId);
            if (!l) return;
            l[key] = val; renderOverlay();
            if (key === 'mode' || key === 'groupLayout') updateUI(); 
            if (key === 'text' || key === 'mode') renderLayerList();
            if (key === 'size') { els.inputs.size.value = val; els.inputs.sizeRange.value = val; els.inputs.sizeLabel.innerText = val; }
            if (key === 'groupSpacing') { els.inputs.groupSpacingRange.value = val; els.inputs.groupSpacingLabel.innerText = val; }
            if (key === 'lineHeight') { els.inputs.lineHeight.value = val; els.inputs.lineHeightRange.value = val; els.inputs.lineHeightLabel.innerText = val; }
            if (key === 'color') els.inputs.colorIndicator.style.backgroundColor = val;
        }

        els.btnModeNormal.addEventListener('click', () => { updateLayer('mode', 'normal'); });
        els.btnModeGroup.addEventListener('click', () => { updateLayer('mode', 'group'); });
        els.groupLayoutRadios.forEach(r => r.addEventListener('change', (e) => { if(e.target.checked) updateLayer('groupLayout', e.target.value); }));
        els.inputs.text.addEventListener('input', (e) => updateLayer('text', e.target.value));
        els.inputs.sizeRange.addEventListener('input', (e) => updateLayer('size', parseInt(e.target.value)));
        els.inputs.groupSpacingRange.addEventListener('input', (e) => updateLayer('groupSpacing', parseInt(e.target.value)));
        els.inputs.lineHeightRange.addEventListener('input', (e) => updateLayer('lineHeight', parseFloat(e.target.value)));
        els.inputs.x.addEventListener('input', (e) => updateLayer('x', parseInt(e.target.value)||0));
        els.inputs.y.addEventListener('input', (e) => updateLayer('y', parseInt(e.target.value)||0));
        els.inputs.color.addEventListener('input', (e) => updateLayer('color', e.target.value));
        els.inputs.bold.addEventListener('click', () => { const l=AppState.layers.find(x=>x.id===AppState.activeLayerId); if(l){l.isBold=!l.isBold; updateUI(); renderOverlay();} });
        els.inputs.italic.addEventListener('click', () => { const l=AppState.layers.find(x=>x.id===AppState.activeLayerId); if(l){l.isItalic=!l.isItalic; updateUI(); renderOverlay();} });
        els.addLayerBtn.addEventListener('click', () => addLayer("Text", AppState.pdfDocDims.width/2, AppState.pdfDocDims.height/2));
        els.deleteLayerBtn.addEventListener('click', () => { if(confirm("刪除?")) deleteLayer(AppState.activeLayerId); });

        function formatTextForLayer(text, layer) {
            if (!text) return "";
            if (layer.mode === 'group') {
                const parts = text.split(/[,，]/).map(s => s.trim()).filter(s => s !== "");
                if (parts.length === 0) return text;
                if (layer.groupLayout === 'v') return parts.join('\n');
                const spacing = layer.groupSpacing || 4;
                return parts.join(" ".repeat(spacing));
            }
            return text;
        }

        function renderOverlay() {
            els.overlay.innerHTML = '';
            if (!AppState.pdfDoc) return;
            const s = AppState.pixelRatio; 
            const h = AppState.pdfDocDims.height; 

            AppState.layers.forEach((l, idx) => {
                const el = document.createElement('div');
                const isSel = l.id === AppState.activeLayerId;
                let rawText = l.text;
                if (AppState.mode === 'batch' && idx === 0 && AppState.tempLayerText) rawText = AppState.tempLayerText;
                const displayText = formatTextForLayer(rawText, l);
                
                const topPx = (h - l.y) * s;
                const leftPx = l.x * s;
                const fontSizePx = l.size * s;

                let fm = "'Noto Sans TC', sans-serif";
                
                el.style.cssText = `
                    position: absolute; 
                    left: ${leftPx}px; 
                    top: ${topPx}px; 
                    transform: translate(-50%, -50%); 
                    font-size: ${fontSizePx}px; 
                    color: ${l.color}; 
                    font-family: ${fm}; 
                    white-space: pre; 
                    text-align: center; 
                    line-height: ${l.lineHeight};
                    border: ${isSel ? '2px dashed #2563eb' : '1px dashed transparent'}; 
                    padding: 2px; 
                    z-index: ${isSel ? 20 : 10}; 
                    cursor: move;
                    pointer-events: auto; 
                    touch-action: none; 
                    font-weight: ${l.isBold ? 'bold' : 'normal'}; 
                    font-style: ${l.isItalic ? 'italic' : 'normal'};
                    user-select: none;
                `;
                el.textContent = displayText;
                
                const active = (e) => { 
                    e.stopPropagation(); 
                    setActiveLayer(l.id); 
                };
                el.onmousedown = active; 
                el.ontouchstart = active;
                els.overlay.appendChild(el);
            });
        }

        const onMove = (clientX, clientY) => {
            if (AppState.activeLayerId) {
                const r = els.canvas.getBoundingClientRect();
                const relativeX = clientX - r.left;
                const relativeY = clientY - r.top;
                
                const pdfX = relativeX / AppState.pixelRatio;
                const pdfY = AppState.pdfDocDims.height - (relativeY / AppState.pixelRatio);

                const l = AppState.layers.find(x => x.id === AppState.activeLayerId);
                if(l) { 
                    l.x = pdfX; 
                    l.y = pdfY; 
                    renderOverlay(); 
                    updateUI(); 
                    els.debugInfo.textContent = `XY: ${Math.round(l.x)}, ${Math.round(l.y)}`;
                }
            }
        };

        els.wrapper.addEventListener('mousedown', (e) => { 
            if(e.target === els.overlay || e.target === els.canvas) { }
            if(AppState.activeLayerId) {
                const moveHandler = (ev) => onMove(ev.clientX, ev.clientY);
                const upHandler = () => {
                    window.removeEventListener('mousemove', moveHandler);
                    window.removeEventListener('mouseup', upHandler);
                };
                window.addEventListener('mousemove', moveHandler);
                window.addEventListener('mouseup', upHandler);
                onMove(e.clientX, e.clientY);
            }
        });

        els.wrapper.addEventListener('touchstart', (e) => {
             if(AppState.activeLayerId) {
                 e.preventDefault(); 
                 const touch = e.touches[0];
                 const moveHandler = (ev) => onMove(ev.touches[0].clientX, ev.touches[0].clientY);
                 const upHandler = () => {
                     window.removeEventListener('touchmove', moveHandler);
                     window.removeEventListener('touchend', upHandler);
                 };
                 window.addEventListener('touchmove', moveHandler, {passive: false});
                 window.addEventListener('touchend', upHandler);
                 onMove(touch.clientX, touch.clientY);
             }
        }, {passive: false});

        function setMode(m) {
            AppState.mode = m;
            const te = els.tabEditor; const tb = els.tabBatch;
            const pe = els.panelEditor; const pb = els.panelBatch;
            const ptw = els.propTextWrapper;
            if (m === 'editor') {
                te.className = "flex-1 py-2 text-xs font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50";
                tb.className = "flex-1 py-2 text-xs font-bold text-slate-500 hover:bg-slate-50";
                pe.classList.remove('hidden'); pb.classList.add('hidden');
                ptw.classList.remove('hidden'); AppState.tempLayerText = null; renderOverlay();
            } else {
                te.className = "flex-1 py-2 text-xs font-bold text-slate-500 hover:bg-slate-50";
                tb.className = "flex-1 py-2 text-xs font-bold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50";
                pe.classList.add('hidden'); pb.classList.remove('hidden');
                ptw.classList.add('hidden');
                if(AppState.layers.length > 0) { setActiveLayer(AppState.layers[0].id); updateBatchPreview(); }
            }
        }
        els.tabEditor.addEventListener('click', () => setMode('editor'));
        els.tabBatch.addEventListener('click', () => setMode('batch'));
        els.batchInput.addEventListener('input', (e) => {
            const c = e.target.value.split('\n').filter(l => l.trim()!=='').length;
            els.nameCount.textContent = c;
            updateBatchPreview();
        });
        function updateBatchPreview() {
            const l = els.batchInput.value.split('\n').filter(l => l.trim()!=='');
            AppState.tempLayerText = l.length>0 ? l[0] : null; renderOverlay();
        }

        // --- Core Drawing Logic (Isolated for reuse) ---
        // This function MUST accept the font object explicitly
        const drawLayerOnPage = (page, font, rawText, layer) => {
            const text = formatTextForLayer(rawText, layer);
            const h = layer.color.replace('#','');
            const r=parseInt(h.substring(0,2),16)/255; 
            const g=parseInt(h.substring(2,4),16)/255; 
            const b=parseInt(h.substring(4,6),16)/255;
            const col = PDFLib.rgb(r,g,b);
            
            const lines = text.split('\n');
            const lh = layer.lineHeight;
            const size = layer.size;
            const lineHeightPx = size * lh;
            const totalHeight = lines.length * lineHeightPx;
            
            // Visual Center -> Baseline Calculation
            // layer.y is the visual center of the text block
            const blockTopY = layer.y + (totalHeight / 2);

            lines.forEach((line, i) => {
                let width = 0;
                try {
                    // Critical: Use the passed font to calculate width
                    width = font.widthOfTextAtSize(line, size);
                } catch(e) { console.warn("Width calc error", e); }

                const x = layer.x - (width / 2); 

                // Refined baseline calculation
                // 0.35 is a standard visual balance factor for Noto Sans
                const lineSlotCenterY = blockTopY - (i * lineHeightPx) - (lineHeightPx / 2);
                const y = lineSlotCenterY - (size * 0.35);

                page.drawText(line, { x, y, size: size, font, color: col });
                
                if(layer.isBold) { 
                    page.drawText(line, { x:x+0.3, y, size, font, color: col });
                    page.drawText(line, { x, y:y+0.3, size, font, color: col });
                }
            });
        };

        // --- Download ---
        els.downloadBtn.addEventListener('click', async () => {
            if(!AppState.pdfBytes || !AppState.fontBytes) return alert("請上傳 PDF 與確認字型");
            if (typeof PDFLib === 'undefined') return alert("系統載入中，請稍後...");
            
            const btn = els.downloadBtn;
            btn.disabled = true; 
            showLoading(true, "生成 PDF 中...");

            // Allow UI to update
            await new Promise(r => setTimeout(r, 100));

            try {
                if(AppState.mode === 'editor') {
                    // Single Mode
                    const pdfDoc = await PDFLib.PDFDocument.load(AppState.pdfBytes);
                    pdfDoc.registerFontkit(fontkit);
                    const font = await pdfDoc.embedFont(AppState.fontBytes, { subset: false });
                    
                    const p = pdfDoc.getPages()[0];
                    AppState.layers.forEach(l => drawLayerOnPage(p, font, l.text, l));
                    
                    const b = await pdfDoc.save();
                    downloadBlob(b, "獎狀_Pro.pdf");

                } else {
                    // Batch Mode
                    const names = els.batchInput.value.split('\n').filter(l => l.trim()!=='');
                    if(names.length===0) throw new Error("名單為空");
                    
                    // Create NEW document
                    const out = await PDFLib.PDFDocument.create();
                    out.registerFontkit(fontkit);
                    
                    // Critical: Embed font into the NEW document
                    const outFont = await out.embedFont(AppState.fontBytes, { subset: false });
                    
                    // Load source for copying
                    const src = await PDFLib.PDFDocument.load(AppState.pdfBytes);
                    
                    const total = names.length;
                    for(let i=0; i<total; i++) {
                         // Update loading text every 5 items to keep UI alive
                        if(i%5 === 0) {
                            els.loadingText.innerText = `處理中... ${i+1}/${total}`;
                            await new Promise(r => setTimeout(r, 0));
                        }

                        const n = names[i];
                        const [pg] = await out.copyPages(src, [0]);
                        const p = out.addPage(pg);
                        
                        // Pass 'outFont' explicitly!
                        if(AppState.layers[0]) drawLayerOnPage(p, outFont, n, AppState.layers[0]);
                        AppState.layers.slice(1).forEach(l => drawLayerOnPage(p, outFont, l.text, l));
                    }
                    
                    const b = await out.save();
                    downloadBlob(b, "批次獎狀_Pro.pdf");
                }
            } catch(e) { 
                console.error(e); 
                alert("錯誤: "+e.message); 
            }
            
            btn.disabled = false; 
            showLoading(false);
        });

        function downloadBlob(bytes, name) {
            const blob = new Blob([bytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        els.zoomIn.addEventListener('click', () => { AppState.zoom += 0.2; updateCanvas(); });
        els.zoomOut.addEventListener('click', () => { if(AppState.zoom>0.4) AppState.zoom -= 0.2; updateCanvas(); });
        function updateZoomLabel() { els.zoomLevel.innerText = Math.round(AppState.zoom*100)+'%'; }
    </script>
</body>
</html>
