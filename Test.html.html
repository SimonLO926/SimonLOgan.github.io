<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>比賽計分器 (極簡扁平黑化版)</title>
    <style>
        :root {
            /* 極簡扁平化色系 */
            --bg: #000000;          /* 純黑背景 */
            --card-bg: #171717;     /* 極暗灰底色 */
            --panel-bg: #0A0A0A;    /* 面板底色 */
            
            --primary: #2563EB;     /* 扁平藍 */
            --success: #10B981;     /* 扁平綠 */
            --warning: #F59E0B;     /* 扁平橘 */
            --danger: #EF4444;      /* 扁平紅 */
            --check: #8B5CF6;       /* 扁平紫 */
            --gray: #737373;        /* 扁平灰 */
            
            --text-main: #FFFFFF;
            --text-muted: #A3A3A3;
        }

        /* 滿版基礎設定 */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            overflow: hidden; background-color: var(--bg); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; /* 移除手機預設點擊高光 */
        }

        /* 頂部列：極簡無邊框 */
        .top-bar {
            flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 16px; background-color: var(--panel-bg);
        }
        select {
            background: var(--card-bg); color: var(--text-main);
            border: none; border-radius: 4px; padding: 4px 8px; font-size: 0.9rem;
            outline: none;
        }
        .btn-global-reset {
            background: transparent; color: var(--text-muted);
            border: none; padding: 4px 8px; font-size: 0.85rem; cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-global-reset:active { opacity: 0.5; }

        /* 主計時器區域：色塊分離 */
        .master-timers {
            flex: 0 0 auto;
            display: flex; gap: 8px; padding: 8px 16px;
            background-color: var(--panel-bg);
        }
        .timer-module {
            flex: 1; border-radius: 8px; padding: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background-color: var(--card-bg);
        }
        
        .timer-header { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; letter-spacing: 1px; }
        .time-display { 
            font-size: 2.2rem; font-weight: 600; font-variant-numeric: tabular-nums; 
            line-height: 1; margin-bottom: 8px; 
        }
        .main-time { color: var(--primary); }
        .cleanup-time { color: var(--warning); }
        
        .ctrl-group { display: flex; gap: 4px; width: 100%; justify-content: center; }
        .ctrl-btn {
            width: 44px; height: 32px; border-radius: 4px; border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; color: white; cursor: pointer; touch-action: manipulation;
            transition: opacity 0.2s;
        }
        .ctrl-btn:active:not(:disabled) { opacity: 0.6; }
        .ctrl-btn:disabled { opacity: 0.15; cursor: not-allowed; }
        
        .btn-play { background-color: var(--success); }
        .btn-pause { background-color: var(--warning); }
        .btn-stop { background-color: var(--danger); }

        /* 選手網格：動態適應，逼不得已才滾動 */
        #players-grid {
            flex: 1 1 auto; 
            display: grid; 
            gap: 8px; padding: 8px 16px 16px 16px;
            overflow-y: auto; overflow-x: hidden;
        }
        #players-grid::-webkit-scrollbar { width: 4px; }
        #players-grid::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        /* 學生卡片：純色塊，無邊框 */
        .player-card {
            background: var(--card-bg); border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: background-color 0.3s;
            min-height: 0; 
        }
        
        /* 扁平化的狀態底色 (使用極暗色系) */
        .card-checking { background: #2E1A47; }
        .card-perfect { background: #064E3B; }
        .card-late { background: #1E3A8A; }
        .card-error { background: #7F1D1D; }

        /* 卡片頂部 */
        .player-header { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;}
        .player-name {
            background: transparent; color: var(--text-main); border: none;
            font-size: 1.05rem; font-weight: 500; width: 60%; padding: 0; outline: none;
        }
        .player-name::placeholder { color: var(--text-muted); }
        .personal-timer { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--gray); }
        .time-checking { color: #D8B4FE; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* 分數與時間細節容器 */
        .score-container {
            flex: 1 1 auto; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 0;
        }
        .score-display {
            font-size: clamp(2rem, 5vh, 3rem);
            font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums;
        }
        .time-detail {
            font-size: 0.7rem; margin-top: 6px; color: rgba(255,255,255,0.6);
            font-variant-numeric: tabular-nums; background: rgba(0,0,0,0.3);
            padding: 3px 8px; border-radius: 4px; /* 扁平化小圓角 */
            height: 14px; line-height: 14px; 
        }

        /* 動態按鈕列 (鎖定高度) */
        .action-row { 
            flex: 0 0 42px; 
            display: flex; gap: 6px; 
        }
        
        /* 極簡按鈕 */
        .action-btn {
            flex: 1; border: none; border-radius: 6px; color: white; font-weight: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 0.9rem; touch-action: manipulation; cursor: pointer;
            transition: opacity 0.2s, background-color 0.2s;
        }
        /* 移除 transform: scale，改用透明度呈現扁平按壓感 */
        .action-btn:active { opacity: 0.6; }
        .action-btn small { font-size: 0.65rem; font-weight: 400; opacity: 0.8; line-height: 1.2;}

        .btn-raise { background-color: var(--primary); font-size: 1rem; }
        .btn-pass { background-color: var(--success); }
        .btn-fail { background-color: var(--danger); }
        .btn-late { background-color: var(--warning); }
        .btn-undo { background-color: rgba(255,255,255,0.1); color: var(--text-muted); font-size: 0.9rem; }

        /* 提示框 (扁平黑化) */
        #modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 100; justify-content: center; align-items: center;
        }
        .modal-box {
            background: var(--card-bg); padding: 24px; border-radius: 8px;
            text-align: center; width: 75%; max-width: 300px;
        }
        .modal-box h2 { font-weight: 500; margin-top: 0; }
        .modal-btn {
            background: var(--primary); color: white; border: none; 
            padding: 10px 24px; border-radius: 4px; font-size: 1rem; width: 100%;
            margin-top: 16px; cursor: pointer;
        }
        .modal-btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <select id="playerCount" onchange="initApp()">
                <option value="3">3 人</option>
                <option value="4">4 人</option>
                <option value="5">5 人</option>
                <option value="6" selected>6 人</option>
            </select>
        </div>
        <button class="btn-global-reset" onclick="initApp()">重設全部</button>
    </div>

    <div class="master-timers">
        <div class="timer-module">
            <div class="timer-header">MATCH TIME</div>
            <div class="time-display main-time" id="mainTimeDisplay">05:00</div>
            <div class="ctrl-group">
                <button class="ctrl-btn btn-play" id="btnMainPlay" onclick="startMainTimer()">▶</button>
                <button class="ctrl-btn btn-pause" id="btnMainPause" onclick="pauseMainTimer()" disabled>⏸</button>
                <button class="ctrl-btn btn-stop" onclick="resetMainTimer()">⏹</button>
            </div>
        </div>

        <div class="timer-module">
            <div class="timer-header">CLEANUP</div>
            <div class="time-display cleanup-time" id="cleanupTimeDisplay">01:00</div>
            <div class="ctrl-group">
                <button class="ctrl-btn btn-play" id="btnCleanupPlay" onclick="startCleanupTimer()">▶</button>
                <button class="ctrl-btn btn-pause" id="btnCleanupPause" onclick="pauseCleanupTimer()" disabled>⏸</button>
                <button class="ctrl-btn btn-stop" onclick="resetCleanupTimer()">⏹</button>
            </div>
        </div>
    </div>

    <div id="players-grid"></div>

    <div id="modal">
        <div class="modal-box">
            <h2 id="modalText">提示</h2>
            <button class="modal-btn" onclick="closeModal()">確認</button>
        </div>
    </div>

    <script>
        const MAIN_TIME = 300; 
        const CLEANUP_TIME = 60; 

        let mainTimeLeft = MAIN_TIME;
        let mainInterval = null;
        let cleanupTimeLeft = CLEANUP_TIME;
        let cleanupInterval = null;

        let players = [];

        function formatTime(sec) {
            let m = Math.floor(sec / 60).toString().padStart(2, '0');
            let s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function showModal(msg, color) {
            document.getElementById('modalText').innerText = msg;
            document.getElementById('modalText').style.color = color;
            document.getElementById('modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        function startMainTimer() {
            if (mainInterval) return;
            document.getElementById('btnMainPlay').disabled = true;
            document.getElementById('btnMainPause').disabled = false;
            
            updateAllCardsTimeColor();

            mainInterval = setInterval(() => {
                if (mainTimeLeft > 0) {
                    mainTimeLeft--;
                    document.getElementById('mainTimeDisplay').innerText = formatTime(mainTimeLeft);
                    
                    players.forEach(p => {
                        if (p.state === 'working') {
                            p.frozenTime = mainTimeLeft;
                            document.getElementById(`time-${p.id}`).innerText = formatTime(mainTimeLeft);
                        }
                    });
                } else {
                    pauseMainTimer();
                    showModal("比賽時間結束", "var(--danger)");
                    players.forEach(p => updateCardUI(p.id));
                }
            }, 1000);
        }

        function pauseMainTimer() {
            clearInterval(mainInterval);
            mainInterval = null;
            document.getElementById('btnMainPlay').disabled = false;
            document.getElementById('btnMainPause').disabled = true;
            updateAllCardsTimeColor();
        }

        function resetMainTimer() {
            pauseMainTimer();
            mainTimeLeft = MAIN_TIME;
            document.getElementById('mainTimeDisplay').innerText = formatTime(mainTimeLeft);
            
            players.forEach(p => {
                if (p.state === 'working' || p.state === 'checking') {
                    p.state = 'working';
                    p.frozenTime = MAIN_TIME;
                    updateCardUI(p.id);
                }
            });
        }

        function startCleanupTimer() {
            if (cleanupInterval) return;
            document.getElementById('btnCleanupPlay').disabled = true;
            document.getElementById('btnCleanupPause').disabled = false;
            cleanupInterval = setInterval(() => {
                if (cleanupTimeLeft > 0) {
                    cleanupTimeLeft--;
                    document.getElementById('cleanupTimeDisplay').innerText = formatTime(cleanupTimeLeft);
                } else {
                    pauseCleanupTimer();
                    showModal("收拾時間結束", "var(--warning)");
                }
            }, 1000);
        }

        function pauseCleanupTimer() {
            clearInterval(cleanupInterval);
            cleanupInterval = null;
            document.getElementById('btnCleanupPlay').disabled = false;
            document.getElementById('btnCleanupPause').disabled = true;
        }

        function resetCleanupTimer() {
            pauseCleanupTimer();
            cleanupTimeLeft = CLEANUP_TIME;
            document.getElementById('cleanupTimeDisplay').innerText = formatTime(cleanupTimeLeft);
        }

        function initApp() {
            resetMainTimer();
            resetCleanupTimer();
            const count = parseInt(document.getElementById('playerCount').value);
            players = [];
            const grid = document.getElementById('players-grid');
            grid.innerHTML = '';
            
            grid.style.gridTemplateColumns = '1fr 1fr'; 
            const rowsCount = Math.ceil(count / 2); 
            
            // 彈性壓縮高度維持不變，確保逼不得已才滾動
            grid.style.gridTemplateRows = `repeat(${rowsCount}, minmax(110px, 1fr))`;

            for (let i = 1; i <= count; i++) {
                players.push({ id: i, name: `同學 ${i}`, state: 'working', score: 0, frozenTime: MAIN_TIME });
                
                const card = document.createElement('div');
                card.id = `card-${i}`;
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="player-header">
                        <input type="text" class="player-name" id="name-${i}" value="同學 ${i}" onblur="saveName(${i}, this.value)">
                        <div class="personal-timer" id="time-${i}">${formatTime(MAIN_TIME)}</div>
                    </div>
                    <div class="score-container" id="score-container-${i}"></div>
                    <div class="action-row" id="actions-${i}"></div>
                `;
                grid.appendChild(card);
                updateCardUI(i);
            }
        }

        function saveName(id, val) {
            const p = players.find(p => p.id === id);
            if(p) p.name = val;
        }

        function updateAllCardsTimeColor() {
            players.forEach(p => {
                const timeEl = document.getElementById(`time-${p.id}`);
                if (p.state === 'working') {
                    timeEl.style.color = mainInterval ? "var(--text-main)" : "var(--gray)";
                }
            });
        }

        function updateCardUI(id) {
            const p = players.find(p => p.id === id);
            const card = document.getElementById(`card-${id}`);
            const actionContainer = document.getElementById(`actions-${id}`);
            const timeEl = document.getElementById(`time-${id}`);
            const scoreContainer = document.getElementById(`score-container-${id}`);

            card.className = 'player-card';
            timeEl.className = 'personal-timer';
            timeEl.innerText = formatTime(p.frozenTime);

            if (p.state === 'working' || p.state === 'checking') {
                scoreContainer.innerHTML = `
                    <div class="score-display">${p.score}</div>
                    <div class="time-detail" style="visibility: hidden;">-</div>
                `;
            } else {
                const usedTime = MAIN_TIME - p.frozenTime;
                scoreContainer.innerHTML = `
                    <div class="score-display">${p.score}</div>
                    <div class="time-detail" style="visibility: visible;">剩餘 ${formatTime(p.frozenTime)} / 耗時 ${formatTime(usedTime)}</div>
                `;
            }

            if (p.state === 'working') {
                if (mainTimeLeft > 0) {
                    timeEl.style.color = mainInterval ? "var(--text-main)" : "var(--gray)";
                    actionContainer.innerHTML = `
                        <button class="action-btn btn-raise" onclick="actionRaiseHand(${id})">舉手檢查</button>
                    `;
                } else {
                    timeEl.style.color = "var(--danger)";
                    actionContainer.innerHTML = `
                        <button class="action-btn btn-late" onclick="actionScore(${id}, 'late')">完成<br><small>100分</small></button>
                        <button class="action-btn btn-fail" onclick="actionScore(${id}, 'error')">出錯<br><small>90分</small></button>
                    `;
                }
            } 
            else if (p.state === 'checking') {
                card.classList.add('card-checking');
                timeEl.classList.add('time-checking');
                actionContainer.innerHTML = `
                    <button class="action-btn btn-pass" onclick="actionScore(${id}, 'perfect')">通過<br><small>${100 + p.frozenTime}分</small></button>
                    <button class="action-btn btn-fail" onclick="actionFailCheck(${id})">失敗<br><small>退回</small></button>
                `;
            } 
            else {
                if (p.state === 'perfect') { card.classList.add('card-perfect'); timeEl.style.color = "var(--success)"; }
                if (p.state === 'late') { card.classList.add('card-late'); timeEl.style.color = "var(--primary)"; }
                if (p.state === 'error') { card.classList.add('card-error'); timeEl.style.color = "var(--danger)"; }
                
                actionContainer.innerHTML = `
                    <button class="action-btn btn-undo" onclick="actionUndo(${id})">重新判定</button>
                `;
            }
        }

        function actionRaiseHand(id) {
            const p = players.find(p => p.id === id);
            p.state = 'checking';
            updateCardUI(id);
        }

        function actionFailCheck(id) {
            const p = players.find(p => p.id === id);
            p.state = 'working';
            p.frozenTime = mainTimeLeft; 
            updateCardUI(id);
        }

        function actionScore(id, type) {
            const p = players.find(p => p.id === id);
            p.state = type;
            if (type === 'perfect') {
                p.score = 100 + Math.max(0, p.frozenTime);
            } else if (type === 'late') {
                p.score = 100;
            } else if (type === 'error') {
                p.score = 90;
            }
            updateCardUI(id);
        }

        function actionUndo(id) {
            const p = players.find(p => p.id === id);
            p.state = 'working';
            p.score = 0;
            p.frozenTime = mainTimeLeft;
            updateCardUI(id);
        }

        window.onload = initApp;
    </script>
</body>
</html>
